overview: "Family profiles for children: hide or allow content, tags, screen time, simplified interface and PIN sign-in"
description: >
  Parental Control turns the parental settings of Jellyfin into family profiles. For each child: show
  everything except what you hide, or only what you allow (titles, series, collections, genres, tags);
  labels you put on titles and keep there (new episodes and collection members included); age rating,
  libraries, access hours painted on a weekly grid and daily screen time with a warning, a stop at the end
  and extra time granted by a parent. Content filtering is enforced by the server through tags and the
  user policy, so it applies to every Jellyfin app, TV apps included. In the web client (browser,
  Jellyfin Desktop, the Android and iOS apps): elements of the menu hidden, a session locked by a parent
  PIN, a friendly screen when the time is up, the time left, and a big PIN pad on the sign-in page.
  Activity of the last days. The web client features need the File Transformation plugin.
category: "General"
