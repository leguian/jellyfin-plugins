                        switchRow('pcaPinSignIn', profile.PinSignIn, t('pinSignIn'), t('pinSignInHelp'), 'dialpad', 'data-profile="PinSignIn"') + '</div>' +
                        warnings +
                        '<div class="pca-field" style="margin-top:1em"><span class="pca-field-label">' + escapeHtml(t('pinSet')) + '</span><span class="pca-option-help">' + escapeHtml(t('pinSetHelp')) + '</span>' + pinForm + '</div>' +
                        '</div>' +
                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('admin_panel_settings') + escapeHtml(t('permissionsTitle')) + '</h3></div>' +
                        '<div>' + permissions + '</div>' +
                        '<div class="pca-field" style="margin-top:0.9em"><label class="pca-field-label" for="pcaSessions">' + escapeHtml(t('maxSessions')) + '</label>' +
                        '<select class="pca-select" id="pcaSessions" data-action="sessions" style="max-width:12em">' + sessions + '</select></div>' +
                        '</div>' +
                        '<div class="pca-card"><div class="pca-actions"><span class="pca-spacer"></span>' +
                        (editor.isNew ? '' : '<button type="button" class="pca-btn pca-btn-danger" data-action="delete-profile">' + icon('remove_moderator') + '<span>' + escapeHtml(t('deleteProfile')) + '</span></button>') +
                        '</div></div>';
                }

                /* ---- activity ---- */

                function activitySection() {
                    var usage = app.editor.view.Usage;
                    var days = usage.Days || [];
                    var max = Math.max.apply(null, days.map(function (day) {
                        return Math.max(day.Seconds, day.LimitMinutes > 0 ? day.LimitMinutes * 60 : 0);
                    }).concat([3600]));
                    var total = days.reduce(function (sum, day) {
                        return sum + day.Seconds;
                    }, 0);
                    var chart = days.map(function (day, index) {
                        var date = new Date(day.Date + 'T12:00:00');
                        var height = Math.round(day.Seconds / max * 100);
                        var over = day.LimitMinutes >= 0 && day.Seconds > day.LimitMinutes * 60 && day.LimitMinutes > 0;
                        var limitLine = day.LimitMinutes > 0 ? '<span class="pca-chart-limit" style="bottom:' + Math.round(day.LimitMinutes * 60 / max * 100) + '%"></span>' : '';
                        var label;
                        try {
                            label = date.toLocaleDateString(LANG, { weekday: 'short' });
                        } catch (e) {
                            label = day.Date;
                        }
                        return '<div class="pca-chart-col' + (index === days.length - 1 ? ' pca-today-col' : '') + (over ? ' pca-over' : '') + '">' +
                            '<span class="pca-chart-value">' + escapeHtml(day.Seconds ? formatSeconds(day.Seconds) : '') + '</span>' +
                            '<span class="pca-chart-area"><span class="pca-chart-bar" style="height:' + height + '%"></span>' + limitLine + '</span>' +
                            '<span class="pca-chart-day">' + escapeHtml(label) + '</span></div>';
                    }).join('');
                    var history = (usage.History || []).length ? '<div class="pca-history">' + usage.History.map(function (entry) {
                        var title = entry.SeriesName ? entry.SeriesName + ' \u2013 ' + entry.Name : entry.Name;
                        return '<div class="pca-history-row"><span class="pca-thumb" style="background-image:url(\'' + escapeHtml(imageUrl(entry.ItemId, 100)) + '\')"></span>' +
                            '<span class="pca-rule-text"><span class="pca-rule-name">' + escapeHtml(title) + '</span>' +
                            '<span class="pca-rule-kind">' + escapeHtml(formatDate(entry.StartedUtc) + (entry.DeviceName ? ' \u00b7 ' + t('onDevice', entry.DeviceName) : '')) + '</span></span>' +
                            '<span class="pca-badge pca-badge-muted">' + escapeHtml(formatSeconds(entry.Seconds)) + '</span></div>';
                    }).join('') + '</div>' : '<div class="pca-empty">' + icon('movie') + '<span>' + escapeHtml(t('historyEmpty')) + '</span></div>';
                    return '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('insights') + escapeHtml(t('activityTitle')) + '</h3><span class="pca-spacer"></span>' +
                        '<span class="pca-badge pca-badge-muted">' + escapeHtml(t('activityTotal', formatSeconds(total))) + '</span></div>' +
                        '<div class="pca-chart" role="img" aria-label="' + escapeHtml(days.map(function (day) {
                            return day.Date + ': ' + formatSeconds(day.Seconds);
                        }).join(', ')) + '">' + chart + '</div></div>' +
                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('history') + escapeHtml(t('historyTitle')) + '</h3></div>' + history + '</div>';
                }

                /* ---- save bar ---- */

                function renderSaveBar() {
                    var bar = page.querySelector('.pca-savebar');
                    var show = app.tab === 'family' && isDirty();
                    if (!show) {
                        if (bar) {
                            bar.remove();
                        }
                        return;
                    }
                    if (!bar) {
                        bar = document.createElement('div');
                        bar.className = 'pca-savebar';
                        bar.setAttribute('role', 'region');
                        bar.setAttribute('aria-label', t('unsaved'));
                        page.appendChild(bar);
                    }
                    var saving = app.editor.saving;
                    bar.innerHTML = '<span class="pca-savebar-text">' + icon('edit_note') + escapeHtml(t('unsaved')) + '</span>' +
                        '<button type="button" class="pca-btn" data-action="discard"' + (saving ? ' disabled' : '') + '>' + escapeHtml(t('cancel')) + '</button>' +
                        '<button type="button" class="pca-btn pca-btn-primary" data-action="save"' + (saving ? ' disabled' : '') + '>' + icon('save') + '<span>' + escapeHtml(t('save')) + '</span></button>';
                }

                function saveProfile() {
                    var editor = app.editor;
                    if (!editor || editor.saving) {
                        return;
                    }
                    if (editor.scheduleOn && editor.draft.Native.AccessSchedules.length === 0) {
                        // Saved as is, this would lift every limit: the parent meant the opposite.
                        toast(t('scheduleEmpty'), true);
                        editor.section = 'time';
                        renderSection();
                        return;
                    }
                    editor.saving = true;
                    renderSaveBar();
                    send('POST', 'Profiles/' + editor.userId, editor.draft).then(function (view) {
                        editor.saving = false;
                        if (app.editor !== editor) {
                            return;
                        }
                        editor.view = view;
                        editor.draft = { Profile: clone(view.Profile), Native: clone(view.Native) };
                        editor.baseline = JSON.stringify(editor.draft);
                        editor.isNew = false;
                        editor.scheduleOn = editor.draft.Native.AccessSchedules.length > 0;
                        editor.preview = null;
                        toast(t('saved'));
                        renderEditor();
                        setTimeout(loadPreview, 1500);
                        getJson('Family').then(function (family) {
                            app.family = family;
                        });
                    }, function (error) {
                        editor.saving = false;
                        renderSaveBar();
                        errorText(error).then(function (text) {
                            toast(t('saveError', text), true);
                        });
                    });
                }

                function discardChanges() {
                    var editor = app.editor;
                    if (!editor) {
                        return;
                    }
                    if (editor.isNew) {
                        app.editor = null;
                        renderSaveBar();
                        renderFamily();
                        return;
                    }
                    editor.draft = JSON.parse(editor.baseline);
                    editor.scheduleOn = editor.draft.Native.AccessSchedules.length > 0;
                    renderEditor();
                }

                /* ---- editor events ---- */

                function applyLimit(minutes) {
                    var editor = app.editor;
                    var limits = editor.draft.Profile.ScreenTime.DailyLimitMinutes;
                    for (var day = 0; day < 7; day++) {
                        var weekend = day === 0 || day === 6;
                        if (editor.limitScope === 'all' || (editor.limitScope === 'weekend' && weekend) || (editor.limitScope === 'weekdays' && !weekend)) {
                            limits[day] = minutes;
                        }
                    }
                }

                function toggleIn(list, value) {
                    var index = list.indexOf(value);
                    if (index >= 0) {
                        list.splice(index, 1);
                    } else {
                        list.push(value);
                    }
                }

                familyPanel().addEventListener('click', function (e) {
                    var target = e.target.closest('[data-action]');
                    if (!target || target.disabled) {
                        return;
                    }
                    var action = target.getAttribute('data-action');
                    var editor = app.editor;
                    switch (action) {
                        case 'open-member':
                            openEditor(target.getAttribute('data-user'));
                            return;
                        case 'back':
                            leaveEditor(function () {
                                renderSaveBar();
                                loadFamily();
                            });
                            return;
                        case 'section':
                            editor.section = target.getAttribute('data-section');
                            renderSection();
                            return;
                        case 'add-rule':
                            var list = target.getAttribute('data-list');
                            openPicker({
                                title: t('pickerTitle', list === 'Allowed' ? t('allowedTitle') : t('hiddenTitle')),
                                kinds: ['items', 'collections', 'genres', 'tags', 'labels'],
                                existing: editor.draft.Profile[list],
                                onAdd: function (rules) {
                                    editor.draft.Profile[list] = editor.draft.Profile[list].concat(rules);
                                    changed(true);
                                }
                            });
                            return;
                        case 'remove-rule':
                            editor.draft.Profile[target.getAttribute('data-list')].splice(Number(target.getAttribute('data-index')), 1);
                            changed(true);
                            return;
                        case 'unrated':
                            toggleIn(editor.draft.Native.BlockUnratedItems, target.getAttribute('data-kind'));
                            changed(true);
                            return;
                        case 'library':
                            toggleIn(editor.draft.Native.EnabledFolders, target.getAttribute('data-id'));
                            changed(true);
                            return;
                        case 'preview-refresh':
                            editor.preview = null;
                            renderSection();
                            loadPreview();
                            return;
                        case 'day-step':
                            var day = Number(target.getAttribute('data-day'));
                            var limits = editor.draft.Profile.ScreenTime.DailyLimitMinutes;
                            limits[day] = Math.max(0, Math.min(MAX_MINUTES, limits[day] + Number(target.getAttribute('data-delta')) * STEP_MINUTES));
                            changed(true);
                            return;
                        case 'day-unlimited':
                            var unlimitedDay = Number(target.getAttribute('data-day'));
                            var dayLimits = editor.draft.Profile.ScreenTime.DailyLimitMinutes;
                            dayLimits[unlimitedDay] = dayLimits[unlimitedDay] < 0 ? 60 : -1;
                            changed(true);
                            return;
                        case 'limit-scope':
                            editor.limitScope = target.getAttribute('data-scope');
                            renderSection();
                            return;
                        case 'limit-preset':
                            applyLimit(Number(target.getAttribute('data-minutes')));
                            changed(true);
                            return;
                        case 'bonus':
                            send('POST', 'Profiles/' + editor.userId + '/Bonus', { Minutes: Number(target.getAttribute('data-minutes')) }).then(function (today) {
                                editor.view.Usage.Today = today;
                                toast(t('bonusAdded'));
                                renderSection();
                            }, function (error) {
                                errorText(error).then(function (text) {
                                    toast(text, true);
                                });
                            });
                            return;
                        case 'schedule-preset':
                            editor.draft.Native.AccessSchedules = gridToSchedule(presetGrid(target.getAttribute('data-preset')));
                            changed(true);
                            return;
                        case 'goto-settings':
                            leaveEditor(function () {
                                showTab('settings');
                            });
                            return;
                        case 'set-user-pin':
                            setUserPin();
                            return;
                        case 'delete-profile':
                            askInPage(t('askDeleteTitle', editor.view.User.Name), t('askDeleteText'), t('deleteProfile'), function () {
                                send('DELETE', 'Profiles/' + editor.userId).then(function () {
                                    app.editor = null;
                                    renderSaveBar();
                                    toast(t('saved'));
                                    loadFamily();
                                }, function (error) {
                                    errorText(error).then(function (text) {
                                        toast(t('saveError', text), true);
                                    });
                                });
                            });
                            return;
                    }
                });

                familyPanel().addEventListener('change', function (e) {
                    var input = e.target;
                    var editor = app.editor;
                    if (!editor) {
                        return;
                    }
                    var profile = editor.draft.Profile;
                    var native = editor.draft.Native;
                    if (input.hasAttribute('data-profile')) {
                        profile[input.getAttribute('data-profile')] = input.checked;
                        if (input.id === 'pcaEnabled') {
                            renderEditor();
                            return;
                        }
                        changed(true);
                    } else if (input.hasAttribute('data-native')) {
                        native[input.getAttribute('data-native')] = input.checked;
                        changed(true);
                    } else if (input.hasAttribute('data-screen')) {
                        profile.ScreenTime[input.getAttribute('data-screen')] = input.checked;
                        changed(true);
                    } else if (input.hasAttribute('data-element')) {
                        toggleIn(profile.HiddenElements, input.getAttribute('data-element'));
                        profile.HiddenElements.sort();
                        changed(false);
                    } else if (input.getAttribute('data-action') === 'mode') {
                        profile.Mode = input.value;
                        changed(true);
                    } else if (input.getAttribute('data-action') === 'rating') {
                        native.MaxParentalRating = input.value === '' ? null : Number(input.value);
                        native.MaxParentalSubRating = null;
                        changed(false);
                    } else if (input.getAttribute('data-action') === 'warning') {
                        profile.ScreenTime.WarningMinutes = Number(input.value);
                        changed(false);
                    } else if (input.getAttribute('data-action') === 'sessions') {
                        native.MaxActiveSessions = Number(input.value);
                        changed(false);
                    } else if (input.getAttribute('data-action') === 'schedule-toggle') {
                        editor.scheduleOn = input.checked;
                        native.AccessSchedules = input.checked ? gridToSchedule(presetGrid('school')) : [];
                        changed(true);
                    }
                });

                function setUserPin() {
                    var editor = app.editor;
                    var panel = familyPanel();
                    var first = panel.querySelector('#pcaPin1').value;
                    var second = panel.querySelector('#pcaPin2').value;
                    var error = panel.querySelector('#pcaPinError');
                    if (!PIN_PATTERN.test(first)) {
                        error.textContent = t('pinInvalid');
                        return;
                    }
                    if (first !== second) {
                        error.textContent = t('pinMismatch');
                        return;
                    }
                    error.textContent = '';
                    send('POST', 'Profiles/' + editor.userId + '/Pin', { Pin: first }).then(function () {
                        panel.querySelector('#pcaPin1').value = '';
                        panel.querySelector('#pcaPin2').value = '';
                        toast(t('pinSaved'));
                    }, function (failure) {
                        errorText(failure).then(function (text) {
                            error.textContent = text;
                        });
                    });
                }

                /* ---- content picker ---- */

                function ruleKey(rule) {
                    return rule.Kind + ':' + (rule.Kind === 'Genre' || rule.Kind === 'Tag' ? String(rule.Value).toLowerCase() : rule.Value);
                }

                function openPicker(options) {
                    var opener = document.activeElement;
                    var existing = {};
                    (options.existing || []).forEach(function (rule) {
                        existing[ruleKey(rule)] = true;
                    });
                    var picker = { kind: options.kinds[0], query: '', results: [], selected: {}, order: [], timer: null, token: 0 };
                    app.picker = picker;
                    var labels = { items: 'pickItems', collections: 'pickCollections', genres: 'pickGenres', tags: 'pickTags', labels: 'pickLabels' };
                    var backdrop = document.createElement('div');
                    backdrop.className = 'pca-backdrop';
                    backdrop.innerHTML = '<div class="pca-dialog pca-dialog-wide" role="dialog" aria-modal="true" aria-labelledby="pcaPickerTitle">' +
                        '<div class="pca-dialog-head"><h2 class="pca-dialog-title" id="pcaPickerTitle"></h2><span class="pca-spacer"></span>' +
                        '<button type="button" class="pca-btn pca-btn-ghost pca-btn-icon" data-pick="close" aria-label="' + escapeHtml(t('cancel')) + '">' + icon('close') + '</button></div>' +
                        '<div class="pca-picker-tools"><div class="pca-segmented" role="tablist">' + options.kinds.map(function (kind) {
                            return '<button type="button" class="pca-seg" role="tab" data-pick="kind" data-kind="' + kind + '" aria-selected="' + (kind === picker.kind) + '">' + escapeHtml(t(labels[kind])) + '</button>';
                        }).join('') + '</div>' +
                        '<div class="pca-search">' + icon('search') + '<input type="search" class="pca-input" placeholder="' + escapeHtml(t('searchPlaceholder')) + '" aria-label="' + escapeHtml(t('searchPlaceholder')) + '" /></div></div>' +
                        '<p class="pca-option-help pca-picker-hint" style="margin:0 0 0.6em"></p>' +
                        '<div class="pca-results" aria-live="polite"></div>' +
                        '<div class="pca-dialog-actions"><span class="pca-member-meta pca-picker-count"></span><span class="pca-spacer"></span>' +
                        '<button type="button" class="pca-btn" data-pick="close">' + escapeHtml(t('cancel')) + '</button>' +
                        '<button type="button" class="pca-btn pca-btn-primary" data-pick="add" disabled>' + icon('add') + '<span>' + escapeHtml(t('addSelected')) + '</span></button></div>' +
                        '</div>';
                    backdrop.querySelector('#pcaPickerTitle').textContent = options.title;
                    page.appendChild(backdrop);
                    var input = backdrop.querySelector('input');
                    var results = backdrop.querySelector('.pca-results');

                    function close() {
                        clearTimeout(picker.timer);
                        app.picker = null;
                        backdrop.remove();
                        if (opener && opener.isConnected && typeof opener.focus === 'function') {
                            opener.focus();
                        }
                    }

                    function updateFooter() {
                        var count = picker.order.length;
                        backdrop.querySelector('.pca-picker-count').textContent = count ? t('selectedCount', count) : '';
                        backdrop.querySelector('[data-pick="add"]').disabled = count === 0;
                    }

                    function render() {
                        var list = picker.kind === 'genres' || picker.kind === 'tags' || picker.kind === 'labels';
                        results.classList.toggle('pca-results-list', list);
                        backdrop.querySelector('.pca-picker-hint').textContent = (picker.kind === 'items' || picker.kind === 'collections') && !picker.query ? t('recentHint') : '';
                        if (picker.loading) {
                            results.innerHTML = '<div class="pca-loading">' + escapeHtml(t('loading')) + '</div>';
                            return;
                        }
                        if (!picker.results.length) {
                            results.innerHTML = '<div class="pca-loading">' + escapeHtml(picker.kind === 'labels' && !app.labels.length ? t('noLabels') : t('noResult')) + '</div>';
                            return;
                        }
                        results.innerHTML = picker.results.map(function (entry, index) {
                            var key = ruleKey(entry.rule);
                            var added = existing[key];
                            var pressed = !!picker.selected[key];
                            var check = '<span class="pca-result-check">' + icon('check') + '</span>';
                            if (list) {
                                return '<button type="button" class="pca-result pca-result-row" data-pick="toggle" data-index="' + index + '" aria-pressed="' + pressed + '"' + (added ? ' disabled' : '') + '>' +
                                    (entry.color ? '<span class="pca-thumb-dot" style="background:' + escapeHtml(entry.color) + '"></span>' : icon(kindIcon(entry.rule))) +
                                    '<span class="pca-rule-text"><span class="pca-result-name">' + escapeHtml(entry.rule.Name) + '</span>' +
                                    (added ? '<span class="pca-result-meta">' + escapeHtml(t('alreadyAdded')) + '</span>' : '') + '</span>' + check + '</button>';
                            }
                            return '<button type="button" class="pca-result" data-pick="toggle" data-index="' + index + '" aria-pressed="' + pressed + '"' + (added ? ' disabled' : '') + '>' +
                                '<span class="pca-poster-image"' + (entry.image ? ' style="background-image:url(\'' + escapeHtml(entry.image) + '\')"' : '') + '>' + (entry.image ? '' : icon(kindIcon(entry.rule))) + '</span>' +
                                check +
                                '<span class="pca-result-name">' + escapeHtml(entry.rule.Name) + '</span>' +
                                '<span class="pca-result-meta">' + escapeHtml(added ? t('alreadyAdded') : kindLabel(entry.rule)) + '</span></button>';
                        }).join('');
                    }

                    function itemEntry(item) {
                        var collection = item.Type === 'BoxSet' || item.Type === 'Playlist';
                        var name = item.Name + (item.ProductionYear && !collection && item.Type !== 'Series' ? ' (' + item.ProductionYear + ')' : '');
                        return {
                            rule: { Kind: collection ? 'Collection' : 'Item', Value: item.Id, Name: name, ItemType: item.Type },
                            image: item.ImageTags && item.ImageTags.Primary ? ApiClient.getUrl('Items/' + item.Id + '/Images/Primary', { fillHeight: 300, quality: 90, tag: item.ImageTags.Primary }) : null
                        };
                    }

                    function search() {
                        var token = ++picker.token;
                        var query = picker.query;
                        var userId = ApiClient.getCurrentUserId();
                        var request;
                        picker.loading = true;
                        render();
                        if (picker.kind === 'items' || picker.kind === 'collections') {
                            var params = {
                                userId: userId,
                                Recursive: true,
                                IncludeItemTypes: picker.kind === 'items' ? 'Movie,Series,MusicAlbum,MusicVideo,Video,AudioBook,Book' : 'BoxSet',
                                Fields: 'ProductionYear',
                                EnableImageTypes: 'Primary',
                                ImageTypeLimit: 1,
                                Limit: PICKER_LIMIT
                            };
                            if (query) {
                                params.SearchTerm = query;
                                params.SortBy = 'SortName';
                            } else {
                                params.SortBy = picker.kind === 'items' ? 'DateCreated' : 'SortName';
                                params.SortOrder = picker.kind === 'items' ? 'Descending' : 'Ascending';
                            }
                            request = ApiClient.getJSON(ApiClient.getUrl('Items', params)).then(function (result) {
                                return ((result && result.Items) || []).map(itemEntry);
                            });
                        } else if (picker.kind === 'genres') {
                            var genreParams = { userId: userId, Limit: 200, SortBy: 'SortName' };
                            if (query) {
                                genreParams.SearchTerm = query;
                            }
                            request = ApiClient.getJSON(ApiClient.getUrl('Genres', genreParams)).then(function (result) {
                                return ((result && result.Items) || []).map(function (genre) {
                                    return { rule: { Kind: 'Genre', Value: genre.Name, Name: genre.Name } };
                                });
                            });
                        } else if (picker.kind === 'tags') {
                            request = ApiClient.getJSON(ApiClient.getUrl('Items/Filters2', { userId: userId, Recursive: true })).then(function (result) {
                                var lower = query.toLowerCase();
                                return ((result && result.Tags) || []).filter(function (tag) {
                                    // The tags of the profiles are the plugin's own machinery, not something to pick.
                                    return tag.toLowerCase().indexOf('pc-') !== 0 && !labelByName(tag) && (!lower || tag.toLowerCase().indexOf(lower) >= 0);
                                }).sort(function (a, b) {
                                    return a.localeCompare(b);
                                }).slice(0, 300).map(function (tag) {
                                    return { rule: { Kind: 'Tag', Value: tag, Name: tag } };
                                });
                            });
                        } else {
                            var lowerLabel = query.toLowerCase();
                            request = Promise.resolve(app.labels.filter(function (label) {
                                return !lowerLabel || label.Name.toLowerCase().indexOf(lowerLabel) >= 0;
                            }).map(function (label) {
                                return { rule: { Kind: 'Label', Value: label.Id, Name: label.Name }, color: label.Color };
                            }));
                        }
                        request.then(function (entries) {
                            if (token !== picker.token || app.picker !== picker) {
                                return;
                            }
                            picker.loading = false;
                            picker.results = entries;
                            render();
                        }, function () {
                            if (token === picker.token) {
                                picker.loading = false;
                                picker.results = [];
                                render();
                            }
                        });
                    }

                    backdrop.addEventListener('click', function (e) {
                        var target = e.target.closest('[data-pick]');
                        if (!target || target.disabled) {
                            return;
                        }
                        var action = target.getAttribute('data-pick');
                        if (action === 'close') {
                            close();
                        } else if (action === 'kind') {
                            picker.kind = target.getAttribute('data-kind');
                            backdrop.querySelectorAll('[data-pick="kind"]').forEach(function (button) {
                                button.setAttribute('aria-selected', button === target ? 'true' : 'false');
                            });
                            search();
                            input.focus();
                        } else if (action === 'toggle') {
                            var entry = picker.results[Number(target.getAttribute('data-index'))];
                            var key = ruleKey(entry.rule);
                            if (picker.selected[key]) {
                                delete picker.selected[key];
                                picker.order.splice(picker.order.indexOf(key), 1);
                            } else {
                                picker.selected[key] = entry.rule;
                                picker.order.push(key);
                            }
                            target.setAttribute('aria-pressed', picker.selected[key] ? 'true' : 'false');
                            updateFooter();
                        } else if (action === 'add') {
                            var rules = picker.order.map(function (key) {
                                return picker.selected[key];
                            });
                            close();
                            options.onAdd(rules);
                        }
                    });
                    backdrop.addEventListener('mousedown', function (e) {
                        if (e.target === backdrop) {
                            close();
                        }
                    });
                    backdrop.addEventListener('keydown', function (e) {
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            e.stopPropagation();
                            close();
                        }
                        trapTab(e, backdrop);
                    });
                    input.addEventListener('input', function () {
                        clearTimeout(picker.timer);
                        picker.timer = setTimeout(function () {
                            picker.query = input.value.trim();
                            search();
                        }, SEARCH_DELAY_MS);
                    });
                    updateFooter();
                    search();
                    input.focus();
                }

                function labelByName(name) {
                    var lower = String(name).toLowerCase();
                    for (var i = 0; i < app.labels.length; i++) {
                        if (app.labels[i].Name.toLowerCase() === lower) {
                            return app.labels[i];
                        }
                    }
                    return null;
                }

                /* ---- labels ---- */

                function labelsPanel() {
                    return page.querySelector('#pcaPanelLabels');
                }

                function renderLabels() {
                    var cards = app.labels.map(function (label) {
                        var preview = label.Targets.slice(0, 3).map(function (rule) {
                            return rule.Name || rule.Value;
                        }).join(', ') + (label.Targets.length > 3 ? '\u2026' : '');
                        return '<div class="pca-label-card" style="--pca-label-color:' + escapeHtml(label.Color) + '">' +
                            '<div class="pca-card-head" style="margin:0"><span class="pca-thumb-dot" style="background:' + escapeHtml(label.Color) + '"></span>' +
                            '<span class="pca-label-name">' + escapeHtml(label.Name) + '</span><span class="pca-spacer"></span>' +
                            '<span class="pca-badge pca-badge-muted">' + escapeHtml(t('labelCount', label.Targets.length)) + '</span></div>' +
                            '<span class="pca-member-meta">' + escapeHtml(preview || t('labelEmpty')) + '</span>' +
                            '<div class="pca-actions"><button type="button" class="pca-btn pca-btn-small" data-action="edit-label" data-id="' + escapeHtml(label.Id) + '">' + icon('edit') + '<span>' + escapeHtml(t('edit')) + '</span></button>' +
                            '<button type="button" class="pca-btn pca-btn-small pca-btn-ghost" data-action="delete-label" data-id="' + escapeHtml(label.Id) + '">' + icon('delete') + '<span>' + escapeHtml(t('deleteLabel')) + '</span></button></div>' +
                            '</div>';
                    }).join('');
                    labelsPanel().innerHTML = '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('sell') + escapeHtml(t('tabLabels')) + '</h3><span class="pca-spacer"></span>' +
                        '<button type="button" class="pca-btn pca-btn-primary" data-action="new-label">' + icon('add') + '<span>' + escapeHtml(t('newLabel')) + '</span></button></div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('labelsIntro')) + '</p>' +
                        (app.labels.length ? '<div class="pca-labels">' + cards + '</div>' : '<div class="pca-empty">' + icon('sell') + '<span>' + escapeHtml(t('labelsEmpty')) + '</span></div>') +
                        '</div>';
                }

                function openLabelEditor(label) {
                    var opener = document.activeElement;
                    var draft = label ? clone(label) : { Name: '', Color: LABEL_COLORS[app.labels.length % LABEL_COLORS.length], Targets: [] };
                    var backdrop = document.createElement('div');
                    backdrop.className = 'pca-backdrop';
                    page.appendChild(backdrop);

                    function close() {
                        backdrop.remove();
                        if (opener && opener.isConnected && typeof opener.focus === 'function') {
                            opener.focus();
                        }
                    }

                    function render() {
                        var name = backdrop.querySelector('#pcaLabelName');
                        if (name) {
                            draft.Name = name.value;
                        }
                        backdrop.innerHTML = '<div class="pca-dialog" style="max-width:42em" role="dialog" aria-modal="true" aria-labelledby="pcaLabelTitle">' +
                            '<div class="pca-dialog-head"><h2 class="pca-dialog-title" id="pcaLabelTitle">' + escapeHtml(label ? t('editLabel') : t('newLabel')) + '</h2><span class="pca-spacer"></span>' +
                            '<button type="button" class="pca-btn pca-btn-ghost pca-btn-icon" data-label="close" aria-label="' + escapeHtml(t('cancel')) + '">' + icon('close') + '</button></div>' +
                            '<div style="overflow-y:auto;flex:1">' +
                            '<div class="pca-field"><label class="pca-field-label" for="pcaLabelName">' + escapeHtml(t('labelName')) + '</label>' +
                            '<input class="pca-input" id="pcaLabelName" maxlength="60" value="' + escapeHtml(draft.Name) + '" /></div>' +
                            '<div class="pca-field" style="margin-top:0.9em"><span class="pca-field-label" id="pcaLabelColorLabel">' + escapeHtml(t('labelColor')) + '</span>' +
                            '<div class="pca-colors" role="radiogroup" aria-labelledby="pcaLabelColorLabel">' + LABEL_COLORS.map(function (color) {
                                return '<button type="button" class="pca-color" role="radio" data-label="color" data-color="' + color + '" aria-checked="' + (draft.Color === color) + '" aria-label="' + color + '" style="background:' + color + '"></button>';
                            }).join('') + '</div></div>' +
                            '<div class="pca-field" style="margin-top:0.9em"><div class="pca-card-head" style="margin:0"><span class="pca-field-label">' + escapeHtml(t('labelTargets')) + '</span><span class="pca-spacer"></span>' +
                            '<button type="button" class="pca-btn pca-btn-small" data-label="add">' + icon('add') + '<span>' + escapeHtml(t('add')) + '</span></button></div>' +
                            (draft.Targets.length ? '<div class="pca-rules">' + draft.Targets.map(function (rule, index) {
                                return '<div class="pca-rule">' + thumbHtml(rule) + '<span class="pca-rule-text"><span class="pca-rule-name">' + escapeHtml(rule.Name || rule.Value) + '</span><span class="pca-rule-kind">' + escapeHtml(kindLabel(rule)) + '</span></span>' +
                                    '<button type="button" class="pca-btn pca-btn-ghost pca-btn-icon" data-label="remove" data-index="' + index + '" aria-label="' + escapeHtml(t('remove', rule.Name || rule.Value)) + '">' + icon('close') + '</button></div>';
                            }).join('') + '</div>' : '<div class="pca-empty">' + icon('sell') + '<span>' + escapeHtml(t('labelEmpty')) + '</span></div>') +
                            '</div></div>' +
                            '<p class="pca-option-help pca-label-error" role="alert"></p>' +
                            '<div class="pca-dialog-actions"><button type="button" class="pca-btn" data-label="close">' + escapeHtml(t('cancel')) + '</button>' +
                            '<button type="button" class="pca-btn pca-btn-primary" data-label="save">' + icon('save') + '<span>' + escapeHtml(t('save')) + '</span></button></div>' +
                            '</div>';
                    }

                    backdrop.addEventListener('click', function (e) {
                        var target = e.target.closest('[data-label]');
                        if (!target) {
                            return;
                        }
                        var action = target.getAttribute('data-label');
                        if (action === 'close') {
                            close();
                        } else if (action === 'color') {
                            draft.Color = target.getAttribute('data-color');
                            render();
                            backdrop.querySelector('[data-color="' + draft.Color + '"]').focus();
                        } else if (action === 'remove') {
                            draft.Name = backdrop.querySelector('#pcaLabelName').value;
                            draft.Targets.splice(Number(target.getAttribute('data-index')), 1);
                            render();
                        } else if (action === 'add') {
                            draft.Name = backdrop.querySelector('#pcaLabelName').value;
                            openPicker({
                                title: t('pickerTitle', draft.Name || t('newLabel')),
                                kinds: ['items', 'collections', 'genres'],
                                existing: draft.Targets,
                                onAdd: function (rules) {
                                    draft.Targets = draft.Targets.concat(rules);
                                    render();
                                }
                            });
                        } else if (action === 'save') {
                            draft.Name = backdrop.querySelector('#pcaLabelName').value;
                            target.disabled = true;
                            send('POST', label ? 'Labels/' + label.Id : 'Labels', draft).then(function () {
                                close();
                                toast(t('labelSaved'));
                                loadLabels().then(renderLabels);
                            }, function (error) {
                                target.disabled = false;
                                errorText(error).then(function (text) {
                                    backdrop.querySelector('.pca-label-error').textContent = text;
                                });
                            });
                        }
                    });
                    backdrop.addEventListener('keydown', function (e) {
                        if (e.key === 'Escape' && !app.picker) {
                            e.preventDefault();
                            e.stopPropagation();
                            close();
                        }
                        if (!app.picker) {
                            trapTab(e, backdrop);
                        }
                    });
                    render();
                    backdrop.querySelector('#pcaLabelName').focus();
                }

                labelsPanel().addEventListener('click', function (e) {
                    var target = e.target.closest('[data-action]');
                    if (!target) {
                        return;
                    }
                    var action = target.getAttribute('data-action');
                    if (action === 'new-label') {
                        openLabelEditor(null);
                    } else if (action === 'edit-label') {
                        openLabelEditor(labelById(target.getAttribute('data-id')));
                    } else if (action === 'delete-label') {
                        var label = labelById(target.getAttribute('data-id'));
                        askInPage(t('askDeleteLabelTitle', label.Name), t('askDeleteLabelText'), t('deleteLabel'), function () {
                            send('DELETE', 'Labels/' + label.Id).then(function () {
                                toast(t('saved'));
                                loadLabels().then(renderLabels);
                            });
                        });
                    }
                });

                /* ---- settings ---- */

                function settingsPanel() {
                    return page.querySelector('#pcaPanelSettings');
                }

                function renderSettings() {
                    var status = app.status;
                    if (!status) {
                        settingsPanel().innerHTML = note(t('loadError'), true);
                        return;
                    }
                    var injection = status.Injection || {};
                    var ftBadge = injection.Registered ? '<span class="pca-badge pca-badge-ok">' + escapeHtml(t('ftActive')) + '</span>' :
                        (injection.FileTransformationDetected ? '<span class="pca-badge pca-badge-error">' + escapeHtml(t('ftFailed')) + '</span>' : '<span class="pca-badge pca-badge-warn">' + escapeHtml(t('ftMissingBadge')) + '</span>');
                    var ftText = injection.Registered ? t('ftActiveText') : t('ftMissingText') + (injection.Error ? ' (' + injection.Error + ')' : '');
                    var sync = status.Sync || {};
                    var languages = [['auto', 'languageAuto'], ['fr', null], ['en', null]].map(function (entry) {
                        var label = entry[1] ? t(entry[1]) : (entry[0] === 'fr' ? 'Fran\u00e7ais' : 'English');
                        return '<option value="' + entry[0] + '"' + (status.MessageLanguage === entry[0] ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
                    }).join('');
                    settingsPanel().innerHTML =
                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('password') + escapeHtml(t('parentPinTitle')) + '</h3><span class="pca-spacer"></span>' +
                        (status.ParentPinSet ? '<span class="pca-badge pca-badge-ok">' + escapeHtml(t('parentPinSet')) + '</span>' : '<span class="pca-badge pca-badge-warn">' + escapeHtml(t('parentPinNotSet')) + '</span>') + '</div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('parentPinText')) + '</p>' +
                        '<div class="pca-row"><div class="pca-field"><label class="pca-field-label" for="pcaParentPin1">' + escapeHtml(t('newPin')) + '</label>' +
                        '<input class="pca-input" id="pcaParentPin1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" style="width:12em" /></div>' +
                        '<div class="pca-field"><label class="pca-field-label" for="pcaParentPin2">' + escapeHtml(t('confirmPin')) + '</label>' +
                        '<input class="pca-input" id="pcaParentPin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" style="width:12em" /></div>' +
                        '<button type="button" class="pca-btn pca-btn-primary" data-action="parent-pin">' + icon('pin') + '<span>' + escapeHtml(status.ParentPinSet ? t('changePin') : t('setParentPin')) + '</span></button>' +
                        (status.ParentPinSet ? '<button type="button" class="pca-btn pca-btn-ghost" data-action="remove-parent-pin">' + icon('delete') + '<span>' + escapeHtml(t('removePin')) + '</span></button>' : '') +
                        '</div><p class="pca-option-help" id="pcaParentPinError" role="alert"></p></div>' +

                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('extension') + escapeHtml(t('ftTitle')) + '</h3><span class="pca-spacer"></span>' + ftBadge +
                        (injection.Registered ? '' : '<button type="button" class="pca-btn pca-btn-small" data-action="retry">' + icon('refresh') + '<span>' + escapeHtml(t('retry')) + '</span></button>') + '</div>' +
                        '<p class="pca-card-desc" style="margin-bottom:0">' + escapeHtml(ftText) + '</p></div>' +

                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('sync') + escapeHtml(t('syncTitle')) + '</h3><span class="pca-spacer"></span>' +
                        (sync.Running ? '<span class="pca-badge pca-badge-warn">' + escapeHtml(t('syncRunning')) + '</span>' : (sync.LastError ? '<span class="pca-badge pca-badge-error">' + escapeHtml(sync.LastError) + '</span>' : '')) +
                        '<button type="button" class="pca-btn pca-btn-small" data-action="sync"' + (sync.Running ? ' disabled' : '') + '>' + icon('sync') + '<span>' + escapeHtml(t('syncNow')) + '</span></button></div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('syncText')) + '</p>' +
                        '<div class="pca-stats"><div class="pca-stat"><div class="pca-stat-value">' + escapeHtml(sync.LastRunUtc ? formatDate(sync.LastRunUtc) : t('syncNever')) + '</div><div class="pca-stat-label">' + escapeHtml(t('syncLast')) + '</div></div>' +
                        '<div class="pca-stat"><div class="pca-stat-value">' + escapeHtml(sync.TaggedItems || 0) + '</div><div class="pca-stat-label">' + escapeHtml(t('syncTagged')) + '</div></div>' +
                        '<div class="pca-stat"><div class="pca-stat-value">' + escapeHtml(sync.LastChanged || 0) + '</div><div class="pca-stat-label">' + escapeHtml(t('syncChanged')) + '</div></div></div></div>' +

                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('tune') + escapeHtml(t('optionsTitle')) + '</h3></div>' +
                        '<div class="pca-field"><label class="pca-field-label" for="pcaLanguage">' + escapeHtml(t('messageLanguage')) + '</label>' +
                        '<select class="pca-select" id="pcaLanguage" style="max-width:16em">' + languages + '</select></div>' +
                        '<div style="margin-top:0.8em">' + switchRow('pcaDeveloper', status.DeveloperMode, t('developerMode'), t('developerModeHelp'), null, '') + '</div>' +
                        '<div class="pca-actions" style="margin-top:0.6em"><span class="pca-spacer"></span><button type="button" class="pca-btn pca-btn-primary" data-action="save-options">' + icon('save') + '<span>' + escapeHtml(t('saveOptions')) + '</span></button></div></div>' +

                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('help') + escapeHtml(t('howTitle')) + '</h3></div>' +
                        '<p class="pca-card-desc" style="margin:0 0 0.5em">' + escapeHtml(t('how1')) + '</p>' +
                        '<p class="pca-card-desc" style="margin:0 0 0.5em">' + escapeHtml(t('how2')) + '</p>' +
                        '<p class="pca-card-desc" style="margin:0">' + escapeHtml(t('how3')) + '</p></div>';
                    if (sync.Running) {
                        setTimeout(function () {
                            if (app.tab === 'settings') {
                                loadStatus().then(renderSettings);
                            }
                        }, 2000);
                    }
                }

                settingsPanel().addEventListener('click', function (e) {
                    var target = e.target.closest('[data-action]');
                    if (!target || target.disabled) {
                        return;
                    }
                    var panel = settingsPanel();
                    switch (target.getAttribute('data-action')) {
                        case 'parent-pin':
                            var first = panel.querySelector('#pcaParentPin1').value;
                            var second = panel.querySelector('#pcaParentPin2').value;
                            var error = panel.querySelector('#pcaParentPinError');
                            if (!PIN_PATTERN.test(first)) {
                                error.textContent = t('pinInvalid');
                                return;
                            }
                            if (first !== second) {
                                error.textContent = t('pinMismatch');
                                return;
                            }
                            send('POST', 'ParentPin', { Pin: first }).then(function () {
                                toast(t('pinSaved'));
                                loadStatus().then(renderSettings);
                            }, function (failure) {
                                errorText(failure).then(function (text) {
                                    error.textContent = text;
                                });
                            });
                            return;
                        case 'remove-parent-pin':
                            askInPage(t('askRemovePinTitle'), t('askRemovePinText'), t('removePin'), function () {
                                send('DELETE', 'ParentPin').then(function () {
                                    toast(t('saved'));
                                    loadStatus().then(renderSettings);
                                });
                            });
                            return;
                        case 'retry':
                            send('POST', 'Status/Retry').then(function (status) {
                                app.status = status;
                                renderSettings();
                            });
                            return;
                        case 'sync':
                            target.disabled = true;
                            send('POST', 'Sync').then(function (status) {
                                app.status = status;
                                toast(t('syncDone'));
                                renderSettings();
                            }, function (failure) {
                                target.disabled = false;
                                errorText(failure).then(function (text) {
                                    toast(text, true);
                                });
                            });
                            return;
                        case 'save-options':
                            send('POST', 'Options', { MessageLanguage: panel.querySelector('#pcaLanguage').value, DeveloperMode: panel.querySelector('#pcaDeveloper').checked }).then(function (status) {
                                app.status = status;
                                toast(t('saved'));
                                renderSettings();
                            }, function (failure) {
                                errorText(failure).then(function (text) {
                                    toast(text, true);
                                });
                            });
                            return;
                    }
                });

                /* ---- lifecycle ---- */

                page.addEventListener('click', function (e) {
                    var target = e.target.closest('.pca-savebar [data-action]');
                    if (!target || target.disabled) {
                        return;
                    }
                    if (target.getAttribute('data-action') === 'save') {
                        saveProfile();
                    } else {
                        discardChanges();
                    }
                });

                // Leaving the page with unsaved changes: the browser asks.
                window.addEventListener('beforeunload', function (e) {
                    if (page.isConnected && isDirty()) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });

                page.addEventListener('pageshow', function () {
                    translatePage(page);
                    syncSurfaces();
                    app.editor = null;
                    app.family = null;
                    showTab('family');
                });

                page.addEventListener('pagehide', function () {
                    var bar = page.querySelector('.pca-savebar');
                    if (bar) {
                        bar.remove();
                    }
                });
            })();
        </script>
    </div>
</body>
</html>
