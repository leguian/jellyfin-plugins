<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Parental Control</title>
</head>
<body>
    <div id="ParentalControlConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
        <style>
            /* Scoped to the plugin page. Surfaces derive from currentColor so both dashboard themes work. The colour
               tokens and their contrast reasoning are the ones of the Customized Home page of this repository. */
            #ParentalControlConfigPage {
                --pca-accent: #00a4dc;
                /* The brand blue as a fill behind white: 4.87:1 for the label, 3.17:1 or better as a boundary. */
                --pca-accent-fill: #007aa3;
                --pca-accent-fill-hover: #0d7fa8;
                --pca-surface: color-mix(in srgb, currentColor 5%, transparent);
                --pca-surface-strong: color-mix(in srgb, currentColor 10%, transparent);
                --pca-border: color-mix(in srgb, currentColor 14%, transparent);
                --pca-muted: color-mix(in srgb, currentColor 68%, transparent);
                --pca-ok: #3fb950;
                --pca-warn: #d29922;
                --pca-error: #f85149;
                --pca-danger-fill: #d03027;
                --pca-danger-fill-hover: #cc3a30;
                --pca-focus: color-mix(in srgb, currentColor 70%, transparent);
                --pca-focus-filled: #0b7fb0;
                /* Allowed slots of the schedule: a fill read as "on", its own boundary on both dashboards. */
                --pca-slot-on: #2e9e5b;
                --pca-sun: #f2a516;
            }

            #ParentalControlConfigPage .pca-shell {
                box-sizing: border-box;
                max-width: 1180px;
                margin: 0 auto;
                padding: 1.5em 1em 6em;
            }

            #ParentalControlConfigPage .hide {
                display: none !important;
            }

            #ParentalControlConfigPage .pca-visually-hidden {
                position: absolute !important;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            /* Header */
            #ParentalControlConfigPage .pca-header {
                display: flex;
                align-items: center;
                gap: 0.9em;
                margin-bottom: 1.4em;
            }

            #ParentalControlConfigPage .pca-header-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2.6em;
                height: 2.6em;
                border-radius: 0.6em;
                background: color-mix(in srgb, var(--pca-accent) 18%, transparent);
                color: color-mix(in srgb, var(--pca-accent) 50%, currentColor);
                flex-shrink: 0;
            }

            #ParentalControlConfigPage .pca-header-icon .material-icons {
                font-size: 1.6em;
            }

            #ParentalControlConfigPage .pca-title {
                margin: 0;
                font-size: 1.5em;
                font-weight: 600;
                line-height: 1.2;
            }

            #ParentalControlConfigPage .pca-subtitle {
                margin: 0.15em 0 0;
                color: var(--pca-muted);
                font-size: 0.95em;
            }

            #ParentalControlConfigPage .pca-version {
                margin-left: auto;
                font-size: 0.8em;
                color: var(--pca-muted);
                border: 1px solid var(--pca-border);
                border-radius: 2em;
                padding: 0.25em 0.8em;
                white-space: nowrap;
            }

            /* Tabs: segmented control */
            #ParentalControlConfigPage .pca-tabs,
            #ParentalControlConfigPage .pca-segmented {
                display: inline-flex;
                flex-wrap: wrap;
                gap: 0.25em;
                padding: 0.25em;
                border-radius: 0.6em;
                background: var(--pca-surface-strong);
                border: 1px solid var(--pca-border);
            }

            #ParentalControlConfigPage .pca-tabs {
                margin-bottom: 1.4em;
            }

            #ParentalControlConfigPage .pca-tab,
            #ParentalControlConfigPage .pca-seg {
                display: inline-flex;
                align-items: center;
                gap: 0.45em;
                border: 0;
                background: transparent;
                color: var(--pca-muted);
                font: inherit;
                font-weight: 500;
                padding: 0.55em 1.2em;
                border-radius: 0.45em;
                cursor: pointer;
                transition: background 0.15s ease, color 0.15s ease;
            }

            #ParentalControlConfigPage .pca-seg {
                padding: 0.4em 0.9em;
                font-size: 0.9em;
            }

            #ParentalControlConfigPage .pca-tab .material-icons,
            #ParentalControlConfigPage .pca-seg .material-icons {
                font-size: 1.2em;
            }

            #ParentalControlConfigPage .pca-tab:hover,
            #ParentalControlConfigPage .pca-seg:hover {
                color: inherit;
            }

            #ParentalControlConfigPage .pca-tab[aria-selected="true"],
            #ParentalControlConfigPage .pca-seg[aria-pressed="true"],
            #ParentalControlConfigPage .pca-seg[aria-selected="true"] {
                background: var(--pca-accent-fill);
                color: #fff;
            }

            /* Cards */
            #ParentalControlConfigPage .pca-card {
                background: var(--pca-surface);
                border: 1px solid var(--pca-border);
                border-radius: 0.8em;
                padding: 1.2em 1.3em;
                margin-bottom: 1.2em;
            }

            #ParentalControlConfigPage .pca-card-head {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.6em;
                margin-bottom: 0.9em;
            }

            #ParentalControlConfigPage .pca-card-title {
                display: flex;
                align-items: center;
                gap: 0.45em;
                margin: 0;
                font-size: 1.05em;
                font-weight: 600;
            }

            #ParentalControlConfigPage .pca-card-title .material-icons {
                font-size: 1.25em;
                color: color-mix(in srgb, var(--pca-accent) 50%, currentColor);
            }

            #ParentalControlConfigPage .pca-card-desc {
                margin: -0.4em 0 1em;
                color: var(--pca-muted);
                font-size: 0.92em;
                line-height: 1.5;
            }

            #ParentalControlConfigPage .pca-spacer {
                flex: 1;
            }

            /* Badges */
            #ParentalControlConfigPage .pca-badge {
                display: inline-flex;
                align-items: center;
                gap: 0.4em;
                font-size: 0.8em;
                font-weight: 500;
                padding: 0.2em 0.7em;
                border-radius: 2em;
                border: 1px solid currentColor;
                white-space: nowrap;
            }

            #ParentalControlConfigPage .pca-badge::before {
                content: "";
                width: 0.5em;
                height: 0.5em;
                border-radius: 50%;
                background: currentColor;
            }

            #ParentalControlConfigPage .pca-badge-ok { color: color-mix(in srgb, var(--pca-ok) 55%, currentColor); }
            #ParentalControlConfigPage .pca-badge-warn { color: color-mix(in srgb, var(--pca-warn) 55%, currentColor); }
            #ParentalControlConfigPage .pca-badge-error { color: color-mix(in srgb, var(--pca-error) 55%, currentColor); }
            #ParentalControlConfigPage .pca-badge-muted { color: var(--pca-muted); }

            /* Buttons */
            #ParentalControlConfigPage .pca-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.4em;
                border: 1px solid var(--pca-border);
                background: var(--pca-surface-strong);
                color: inherit;
                font: inherit;
                font-size: 0.92em;
                font-weight: 500;
                padding: 0.5em 1em;
                border-radius: 0.45em;
                cursor: pointer;
                white-space: nowrap;
            }

            #ParentalControlConfigPage .pca-btn:hover {
                background: color-mix(in srgb, currentColor 16%, transparent);
            }

            #ParentalControlConfigPage .pca-btn[disabled] {
                opacity: 0.5;
                cursor: default;
            }

            #ParentalControlConfigPage .pca-btn .material-icons {
                font-size: 1.15em;
            }

            #ParentalControlConfigPage .pca-btn-primary {
                background: var(--pca-accent-fill);
                border-color: var(--pca-accent-fill);
                color: #fff;
            }

            #ParentalControlConfigPage .pca-btn-primary:hover {
                background: var(--pca-accent-fill-hover);
                border-color: var(--pca-accent-fill-hover);
            }

            #ParentalControlConfigPage .pca-btn-danger {
                background: var(--pca-danger-fill);
                border-color: var(--pca-danger-fill);
                color: #fff;
            }

            #ParentalControlConfigPage .pca-btn-danger:hover {
                background: var(--pca-danger-fill-hover);
                border-color: var(--pca-danger-fill-hover);
            }

            #ParentalControlConfigPage .pca-btn-ghost {
                background: transparent;
                border-color: transparent;
            }

            #ParentalControlConfigPage .pca-btn-icon {
                padding: 0.45em;
            }

            #ParentalControlConfigPage .pca-btn-small {
                font-size: 0.82em;
                padding: 0.35em 0.75em;
            }

            #ParentalControlConfigPage .pca-btn:focus-visible,
            #ParentalControlConfigPage .pca-tab:focus-visible,
            #ParentalControlConfigPage .pca-seg:focus-visible,
            #ParentalControlConfigPage .pca-member:focus-visible,
            #ParentalControlConfigPage .pca-mode:focus-within,
            #ParentalControlConfigPage .pca-result:focus-visible,
            #ParentalControlConfigPage .pca-nav-item:focus-visible,
            #ParentalControlConfigPage .pca-chip-toggle:focus-visible,
            #ParentalControlConfigPage .pca-color:focus-visible,
            #ParentalControlConfigPage .pca-grid:focus-visible {
                outline: 2px solid var(--pca-focus);
                outline-offset: 2px;
            }

            #ParentalControlConfigPage .pca-btn-primary:focus-visible,
            #ParentalControlConfigPage .pca-btn-danger:focus-visible,
            #ParentalControlConfigPage .pca-tab[aria-selected="true"]:focus-visible,
            #ParentalControlConfigPage .pca-seg[aria-pressed="true"]:focus-visible {
                outline-color: var(--pca-focus-filled);
            }

            #ParentalControlConfigPage .pca-actions {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.6em;
            }

            /* Switch rows */
            #ParentalControlConfigPage .pca-option {
                display: flex;
                align-items: flex-start;
                gap: 1em;
                padding: 0.85em 0;
                border-top: 1px solid var(--pca-border);
                cursor: pointer;
            }

            #ParentalControlConfigPage .pca-option:first-child {
                border-top: 0;
                padding-top: 0.2em;
            }

            #ParentalControlConfigPage .pca-option-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2.1em;
                height: 2.1em;
                border-radius: 0.5em;
                background: var(--pca-surface-strong);
                flex-shrink: 0;
            }

            #ParentalControlConfigPage .pca-option-icon .material-icons {
                font-size: 1.2em;
            }

            #ParentalControlConfigPage .pca-option-text {
                flex: 1;
                min-width: 0;
            }

            #ParentalControlConfigPage .pca-option-label {
                display: block;
                font-weight: 500;
            }

            #ParentalControlConfigPage .pca-option-help {
                display: block;
                color: var(--pca-muted);
                font-size: 0.88em;
                margin-top: 0.15em;
                line-height: 1.45;
            }

            #ParentalControlConfigPage .pca-switch {
                appearance: none;
                -webkit-appearance: none;
                position: relative;
                color: inherit;
                font-size: inherit;
                width: 2.6em;
                height: 1.45em;
                border-radius: 1em;
                background: var(--pca-surface-strong);
                border: 1px solid var(--pca-border);
                cursor: pointer;
                flex-shrink: 0;
                margin: 0.25em 0 0;
                transition: background 0.15s ease, border-color 0.15s ease;
            }

            #ParentalControlConfigPage .pca-switch::after {
                content: "";
                position: absolute;
                top: 50%;
                left: 0.18em;
                width: 1em;
                height: 1em;
                border-radius: 50%;
                background: currentColor;
                opacity: 0.75;
                transform: translateY(-50%);
                transition: left 0.15s ease, opacity 0.15s ease, background 0.15s ease;
            }

            #ParentalControlConfigPage .pca-switch:checked {
                background: var(--pca-accent-fill);
                border-color: var(--pca-accent-fill);
            }

            #ParentalControlConfigPage .pca-switch:checked::after {
                left: calc(100% - 1.18em);
                background: #fff;
                opacity: 1;
            }

            #ParentalControlConfigPage .pca-switch:focus-visible {
                outline: 2px solid var(--pca-focus);
                outline-offset: 2px;
            }

            /* Fields */
            #ParentalControlConfigPage .pca-input,
            #ParentalControlConfigPage .pca-select {
                box-sizing: border-box;
                background: var(--pca-surface);
                border: 1px solid var(--pca-border);
                border-radius: 0.45em;
                color: inherit;
                font: inherit;
                font-size: 0.92em;
                padding: 0.5em 0.7em;
                min-width: 0;
            }

            #ParentalControlConfigPage .pca-select option {
                color: initial;
            }

            #ParentalControlConfigPage .pca-input:focus,
            #ParentalControlConfigPage .pca-select:focus {
                outline: none;
                border-color: var(--pca-accent-fill);
            }

            #ParentalControlConfigPage .pca-field {
                display: flex;
                flex-direction: column;
                gap: 0.35em;
            }

            #ParentalControlConfigPage .pca-field-label {
                font-weight: 500;
                font-size: 0.92em;
            }

            #ParentalControlConfigPage .pca-row {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-end;
                gap: 0.8em;
            }

            #ParentalControlConfigPage .pca-note {
                display: flex;
                gap: 0.6em;
                align-items: flex-start;
                padding: 0.75em 0.9em;
                border-radius: 0.6em;
                background: var(--pca-surface-strong);
                font-size: 0.9em;
                line-height: 1.5;
                margin-top: 0.9em;
            }

            #ParentalControlConfigPage .pca-note .material-icons {
                font-size: 1.25em;
                color: color-mix(in srgb, var(--pca-accent) 50%, currentColor);
            }

            #ParentalControlConfigPage .pca-note-warn .material-icons {
                color: color-mix(in srgb, var(--pca-warn) 60%, currentColor);
            }

            #ParentalControlConfigPage .pca-note-warn {
                border: 1px solid color-mix(in srgb, var(--pca-warn) 45%, transparent);
            }

            #ParentalControlConfigPage .pca-link {
                background: none;
                border: 0;
                padding: 0;
                color: inherit;
                font: inherit;
                text-decoration: underline;
                cursor: pointer;
            }

            /* Family */
            #ParentalControlConfigPage .pca-hero {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 1.2em;
                align-items: center;
                padding: 1.4em 1.5em;
                border-radius: 0.9em;
                margin-bottom: 1.4em;
                background: linear-gradient(120deg, color-mix(in srgb, var(--pca-accent) 16%, transparent), color-mix(in srgb, var(--pca-sun) 12%, transparent));
                border: 1px solid var(--pca-border);
            }

            #ParentalControlConfigPage .pca-hero-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 3.4em;
                height: 3.4em;
                border-radius: 50%;
                background: var(--pca-accent-fill);
                color: #fff;
            }

            #ParentalControlConfigPage .pca-hero-icon .material-icons {
                font-size: 1.9em;
            }

            #ParentalControlConfigPage .pca-hero h2 {
                margin: 0 0 0.3em;
                font-size: 1.15em;
            }

            #ParentalControlConfigPage .pca-steps {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4em 1.4em;
                margin: 0;
                padding: 0;
                list-style: none;
                color: var(--pca-muted);
                font-size: 0.92em;
            }

            #ParentalControlConfigPage .pca-steps b {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 1.5em;
                height: 1.5em;
                margin-right: 0.35em;
                border-radius: 50%;
                background: var(--pca-surface-strong);
                color: inherit;
                font-size: 0.85em;
            }

            #ParentalControlConfigPage .pca-family {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(15.5em, 1fr));
                gap: 1em;
            }

            #ParentalControlConfigPage .pca-member {
                display: flex;
                flex-direction: column;
                gap: 0.8em;
                padding: 1.1em;
                border-radius: 0.9em;
                border: 1px solid var(--pca-border);
                background: var(--pca-surface);
                color: inherit;
                font: inherit;
                text-align: left;
                cursor: pointer;
                transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
            }

            #ParentalControlConfigPage .pca-member:hover:not([disabled]) {
                transform: translateY(-2px);
                background: var(--pca-surface-strong);
            }

            #ParentalControlConfigPage .pca-member[disabled] {
                cursor: default;
                opacity: 0.7;
            }

            #ParentalControlConfigPage .pca-member-top {
                display: flex;
                align-items: center;
                gap: 0.8em;
            }

            #ParentalControlConfigPage .pca-avatar {
                width: 3em;
                height: 3em;
                border-radius: 50%;
                background: color-mix(in srgb, var(--pca-accent) 22%, transparent) center / cover no-repeat;
                color: color-mix(in srgb, var(--pca-accent) 50%, currentColor);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 1.1em;
                text-transform: uppercase;
                flex-shrink: 0;
            }

            #ParentalControlConfigPage .pca-avatar-large {
                width: 3.6em;
                height: 3.6em;
                font-size: 1.3em;
            }

            #ParentalControlConfigPage .pca-member-name {
                font-weight: 600;
                font-size: 1.05em;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #ParentalControlConfigPage .pca-member-meta {
                color: var(--pca-muted);
                font-size: 0.86em;
                line-height: 1.4;
            }

            #ParentalControlConfigPage .pca-meter {
                height: 0.45em;
                border-radius: 1em;
                background: var(--pca-surface-strong);
                overflow: hidden;
            }

            #ParentalControlConfigPage .pca-meter > span {
                display: block;
                height: 100%;
                border-radius: 1em;
                background: var(--pca-ok);
                transition: width 0.3s ease;
            }

            #ParentalControlConfigPage .pca-meter-warn > span {
                background: var(--pca-warn);
            }

            #ParentalControlConfigPage .pca-meter-over > span {
                background: var(--pca-error);
            }

            #ParentalControlConfigPage .pca-member-cta {
                display: flex;
                align-items: center;
                gap: 0.35em;
                margin-top: auto;
                font-weight: 500;
                font-size: 0.9em;
                color: color-mix(in srgb, var(--pca-accent) 50%, currentColor);
            }

            #ParentalControlConfigPage .pca-member-cta .material-icons {
                font-size: 1.15em;
            }

            /* Profile editor */
            #ParentalControlConfigPage .pca-editor-head {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 1em;
                margin-bottom: 1.2em;
            }

            #ParentalControlConfigPage .pca-editor-name {
                margin: 0;
                font-size: 1.35em;
                font-weight: 600;
            }

            #ParentalControlConfigPage .pca-editor-layout {
                display: grid;
                grid-template-columns: 13em 1fr;
                gap: 1.4em;
                align-items: start;
            }

            #ParentalControlConfigPage .pca-nav {
                position: sticky;
                top: 5em;
                display: flex;
                flex-direction: column;
                gap: 0.25em;
            }

            #ParentalControlConfigPage .pca-nav-item {
                display: flex;
                align-items: center;
                gap: 0.6em;
                padding: 0.65em 0.9em;
                border: 0;
                border-radius: 0.55em;
                background: transparent;
                color: var(--pca-muted);
                font: inherit;
                font-weight: 500;
                text-align: left;
                cursor: pointer;
            }

            #ParentalControlConfigPage .pca-nav-item:hover {
                background: var(--pca-surface);
                color: inherit;
            }

            #ParentalControlConfigPage .pca-nav-item[aria-selected="true"] {
                background: var(--pca-surface-strong);
                color: inherit;
                box-shadow: inset 3px 0 0 var(--pca-accent-fill);
            }

            #ParentalControlConfigPage .pca-nav-item .material-icons {
                font-size: 1.25em;
            }

            #ParentalControlConfigPage .pca-modes {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(16em, 1fr));
                gap: 0.8em;
            }

            #ParentalControlConfigPage .pca-mode {
                position: relative;
                display: flex;
                gap: 0.8em;
                padding: 1em;
                border-radius: 0.7em;
                border: 2px solid var(--pca-border);
                cursor: pointer;
                transition: border-color 0.15s ease, background 0.15s ease;
            }

            #ParentalControlConfigPage .pca-mode input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }

            #ParentalControlConfigPage .pca-mode:hover {
                background: var(--pca-surface);
            }

            #ParentalControlConfigPage .pca-mode.pca-selected {
                border-color: var(--pca-accent-fill);
                background: color-mix(in srgb, var(--pca-accent) 8%, transparent);
            }

            #ParentalControlConfigPage .pca-mode-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2.4em;
                height: 2.4em;
                border-radius: 50%;
                background: var(--pca-surface-strong);
                flex-shrink: 0;
            }

            #ParentalControlConfigPage .pca-mode.pca-selected .pca-mode-icon {
                background: var(--pca-accent-fill);
                color: #fff;
            }

            #ParentalControlConfigPage .pca-mode-title {
                display: block;
                font-weight: 600;
                margin-bottom: 0.2em;
            }

            #ParentalControlConfigPage .pca-mode-text {
                display: block;
                color: var(--pca-muted);
                font-size: 0.88em;
                line-height: 1.45;
            }

            /* Content lists */
            #ParentalControlConfigPage .pca-rules {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(14.5em, 1fr));
                gap: 0.6em;
            }

            #ParentalControlConfigPage .pca-rule {
                display: flex;
                align-items: center;
                gap: 0.7em;
                padding: 0.45em 0.45em 0.45em 0.5em;
                border-radius: 0.6em;
                background: var(--pca-surface-strong);
                min-width: 0;
            }

            #ParentalControlConfigPage .pca-thumb {
                width: 2.4em;
                height: 3.4em;
                border-radius: 0.35em;
                background: var(--pca-surface-strong) center / cover no-repeat;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: var(--pca-muted);
                flex-shrink: 0;
                overflow: hidden;
            }

            #ParentalControlConfigPage .pca-thumb .material-icons {
                font-size: 1.3em;
            }

                function currentLanguage() {
                    var lang = '';
                    try {
                        var userId = ApiClient && ApiClient.getCurrentUserId && ApiClient.getCurrentUserId();
                        if (userId) {
                            lang = localStorage.getItem(userId + '-language') || '';
                        }
                    } catch (e) {
                        lang = '';
                    }
                    if (!lang) {
                        lang = document.documentElement.lang || navigator.language || 'en';
                    }
                    return String(lang).toLowerCase();
                }

                var LANG = currentLanguage();
                var STRINGS = I18N[LANG.split('-')[0]] || I18N.en;

                function t(key) {
                    var text = STRINGS[key] || I18N.en[key] || key;
                    for (var i = 1; i < arguments.length; i++) {
                        text = text.split('{' + (i - 1) + '}').join(String(arguments[i]));
                    }
                    return text;
                }

                    });
                }

                /* ---- server ---- */

                function url(path, params) {
                    return ApiClient.getUrl(API + path, params);
                }

                function getJson(path, params) {
                    return ApiClient.getJSON(url(path, params));
                }

                function send(method, path, body) {
                    var request = { type: method, url: url(path) };
                    if (body !== undefined) {
                        request.data = JSON.stringify(body);
                        request.contentType = 'application/json';
                    }
                    return ApiClient.ajax(request).then(readBody);
                }

                // ApiClient.ajax answers with the fetch Response when no dataType is given: JSON when there is a body.
                function readBody(response) {
                    if (response && typeof response.text === 'function') {
                        return response.text().then(function (text) {
                            return text ? JSON.parse(text) : null;
                        });
                    }
                    return response;
                }

                function errorText(error) {
                    if (error && typeof error.text === 'function') {
                        return error.text().then(function (text) {
                            return text ? text.replace(/^"|"$/g, '') : t('genericError');
                        }, function () {
                            return t('genericError');
                        });
                    }
                    return Promise.resolve((error && error.message) || t('genericError'));
                }

                function imageUrl(itemId, height) {
                    return ApiClient.getUrl('Items/' + itemId + '/Images/Primary', { fillHeight: height, quality: 90 });
                }

                function userImageUrl(member) {
                    return member.PrimaryImageTag ? ApiClient.getUrl('Users/' + member.UserId + '/Images/Primary', { tag: member.PrimaryImageTag, height: 160 }) : null;
                }

                /* ---- formatting ---- */

                function formatMinutes(minutes) {
                    if (minutes <= 0) {
                        return t('none');
                    }
                    if (minutes < 60) {
                        return t('minutes', minutes);
                    }
                    var hours = Math.floor(minutes / 60);
                    var rest = minutes % 60;
                    return rest === 0 ? t('hours', hours) : t('hoursMinutes', hours, rest < 10 ? '0' + rest : rest);
                }

                function formatSeconds(seconds) {
                    if (seconds > 0 && seconds < 60) {
                        return t('lessThanMinute');
                    }
                    return formatMinutes(Math.round(seconds / 60));
                }

                function dayName(day, style) {
                    // 2023-01-01 was a Sunday.
                    var date = new Date(2023, 0, 1 + day);
                    try {
                        var name = date.toLocaleDateString(LANG, { weekday: style || 'long' });
                        return name.charAt(0).toUpperCase() + name.slice(1);
                    } catch (e) {
                        return DAY_KEYS[day];
                    }
                }

                function formatHour(hour) {
                    var h = Math.floor(hour);
                    var m = Math.round((hour - h) * 60);
                    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
                }

                function formatDate(value) {
                    var date = new Date(value);
                    if (isNaN(date.getTime())) {
                        return '';
                    }
                    try {
                        return date.toLocaleString(LANG, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                    } catch (e) {
                        return date.toLocaleString();
                    }
                }

                function kindLabel(rule) {
                    if ((rule.Kind === 'Item' || rule.Kind === 'Collection') && rule.ItemType && STRINGS['type' + rule.ItemType]) {
                        return t('type' + rule.ItemType);
                    }
                    return t('kind' + rule.Kind);
                }

                function kindIcon(rule) {
                    switch (rule.Kind) {
                        case 'Collection': return 'video_library';
                        case 'Genre': return 'theater_comedy';
                        case 'Tag': return 'tag';
                        case 'Label': return 'sell';
                        default:
                            if (rule.ItemType === 'Series' || rule.ItemType === 'Season') {
                                return 'tv';
                            }
                            if (rule.ItemType === 'MusicAlbum' || rule.ItemType === 'Audio') {
                                return 'album';
                            }
                            return 'movie';
                    }
                }

                function labelById(id) {
                    for (var i = 0; i < app.labels.length; i++) {
                        if (app.labels[i].Id === id) {
                            return app.labels[i];
                        }
                    }
                    return null;
                }

                /* ---- feedback ---- */

                var toastTimer = null;

                function toast(message, isError) {
                    var node = page.querySelector('#pcaToast');
                    node.innerHTML = icon(isError ? 'error' : 'check_circle') + '<span class="pca-toast-text"></span>';
                    node.querySelector('.pca-toast-text').textContent = message;
                    node.classList.toggle('pca-toast-error', !!isError);
                    node.classList.add('pca-visible');
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(function () {
                        node.classList.remove('pca-visible');
                    }, 3500);
                }

                // Dialogs, the save bar and the hole of the usage ring must be opaque, in the colour of the page. The
                // dashboard paints its background on <body> (10.11) or on a container of the app (12.x): the first
                // painted ancestor gives it; without one, a neutral surface matching the text colour of the theme.
                function isTransparent(colour) {
                    return !colour || colour === 'transparent' || /rgba\([^)]*,\s*0\)$/.test(colour);
                }

                function syncSurfaces() {
                    var background = null;
                    for (var node = page; node && node.nodeType === 1; node = node.parentElement) {
                        var colour = getComputedStyle(node).backgroundColor;
                        if (!isTransparent(colour)) {
                            background = colour;
                            break;
                        }
                    }
                    if (!background) {
                        var text = getComputedStyle(page).color.match(/\d+(\.\d+)?/g) || ['255', '255', '255'];
                        var light = (Number(text[0]) + Number(text[1]) + Number(text[2])) / 3 > 128;
                        background = light ? '#181818' : '#ffffff';
                    }
                    page.style.setProperty('--pca-ask-surface', background);
                    page.style.setProperty('--pca-ring-hole', background);
                }

                function trapTab(e, container) {
                    if (e.key !== 'Tab') {
                        return;
                    }
                    var stops = Array.prototype.filter.call(container.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex="0"]'), function (node) {
                        return node.offsetParent !== null;
                    });
                    if (stops.length === 0) {
                        return;
                    }
                    var index = stops.indexOf(document.activeElement);
                    if (e.shiftKey && index <= 0) {
                        e.preventDefault();
                        stops[stops.length - 1].focus();
                    } else if (!e.shiftKey && index === stops.length - 1) {
                        e.preventDefault();
                        stops[0].focus();
                    }
                }

                /*
                 * A question asked in the page instead of window.confirm (missing in several shells, cannot be styled,
                 * cannot start on the safe answer): role=alertdialog, focus on Cancel, Escape cancels.
                 */
                function askInPage(title, question, confirmLabel, onConfirm) {
                    if (app.question) {
                        return;
                    }
                    var opener = document.activeElement;
                    var backdrop = document.createElement('div');
                    backdrop.className = 'pca-backdrop';
                    backdrop.innerHTML = '<div class="pca-dialog" role="alertdialog" aria-modal="true" aria-labelledby="pcaAskTitle" aria-describedby="pcaAskText">' +
                        '<div class="pca-dialog-head"><span class="material-icons pca-warn-icon" aria-hidden="true">warning</span>' +
                        '<h2 class="pca-dialog-title" id="pcaAskTitle"></h2></div>' +
                        '<p class="pca-dialog-text" id="pcaAskText"></p>' +
                        '<div class="pca-dialog-actions">' +
                        '<button type="button" class="pca-btn pca-ask-no"></button>' +
                        '<button type="button" class="pca-btn pca-btn-danger pca-ask-yes"></button>' +
                        '</div></div>';
                    backdrop.querySelector('.pca-dialog-title').textContent = title;
                    backdrop.querySelector('.pca-dialog-text').textContent = question;
                    backdrop.querySelector('.pca-ask-no').textContent = t('cancel');
                    backdrop.querySelector('.pca-ask-yes').textContent = confirmLabel;

                    function close() {
                        if (!app.question) {
                            return;
                        }
                        app.question = null;
                        backdrop.remove();
                        if (opener && opener.isConnected && typeof opener.focus === 'function') {
                            opener.focus();
                        }
                    }

                    backdrop.addEventListener('keydown', function (e) {
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            e.stopPropagation();
                            close();
                        }
                        trapTab(e, backdrop);
                    });
                    backdrop.querySelector('.pca-ask-no').addEventListener('click', close);
                    backdrop.querySelector('.pca-ask-yes').addEventListener('click', function () {
                        close();
                        onConfirm();
                    });
                    backdrop.addEventListener('mousedown', function (e) {
                        if (e.target === backdrop) {
                            close();
                        }
                    });
                    page.appendChild(backdrop);
                    app.question = { close: close };
                    backdrop.querySelector('.pca-ask-no').focus();
                }

                /* ---- shared pieces of markup ---- */

                function switchRow(id, checked, label, help, iconName, attributes) {

                    }

                function rulesHtml(rules, list, emptyText) {
                    if (!rules.length) {

                    return '<div class="pca-rules">' + rules.map(function (rule, index) {
                        var name = rule.Kind === 'Label' && labelById(rule.Value) ? labelById(rule.Value).Name : (rule.Name || rule.Value);
                        return '<div class="pca-rule">' + thumbHtml(rule) +

                /* ---- tabs ---- */

                function leaveEditor(then) {
                    var editor = app.editor;
                    if (editor && isDirty()) {
                        askInPage(t('askDiscardTitle'), t('askDiscardText', editor.view.User.Name), t('discard'), function () {
                            app.editor = null;
                            then();
                        });
                        return;
                    }
                    app.editor = null;
                    then();
                }

                function showTab(name) {
                    app.tab = name;
                    page.querySelectorAll('.pca-tab').forEach(function (tab) {
                        var selected = tab.getAttribute('data-tab') === name;
                        tab.setAttribute('aria-selected', selected ? 'true' : 'false');
                        tab.tabIndex = selected ? 0 : -1;
                    });
                    page.querySelector('#pcaPanelFamily').classList.toggle('hide', name !== 'family');
                    page.querySelector('#pcaPanelLabels').classList.toggle('hide', name !== 'labels');
                    page.querySelector('#pcaPanelSettings').classList.toggle('hide', name !== 'settings');
                    renderSaveBar();
                    if (name === 'family') {
                        loadFamily();
                    } else if (name === 'labels') {
                        loadLabels().then(renderLabels);
                    } else {
                        loadStatus().then(renderSettings);
                    }
                }

                var tabs = page.querySelector('.pca-tabs');
                tabs.addEventListener('click', function (e) {
                    var button = e.target.closest('.pca-tab');
                    if (button && button.getAttribute('data-tab') !== app.tab) {
                        leaveEditor(function () {
                            showTab(button.getAttribute('data-tab'));
                        });
                    }
                });
                tabs.addEventListener('keydown', function (e) {
                    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
                        return;
                    }
                    var buttons = Array.prototype.slice.call(tabs.querySelectorAll('.pca-tab'));
                    var current = buttons.indexOf(document.activeElement);
                    var next = (current + (e.key === 'ArrowRight' ? 1 : buttons.length - 1)) % buttons.length;
                    buttons[next].focus();
                    leaveEditor(function () {
                        showTab(buttons[next].getAttribute('data-tab'));
                    });
                });

                /* ---- data ---- */

                function loadStatus() {
                    return getJson('Status').then(function (status) {
                        app.status = status;
                        page.querySelector('#pcaVersion').textContent = 'v' + (status.PluginVersion || '');
                        return status;
                    }, function () {
                        return app.status;
                    });
                }

                function loadLabels() {
                    return getJson('Labels').then(function (labels) {
                        app.labels = labels || [];
                        return app.labels;
                    }, function () {
                        return app.labels;
                    });
                }

                function loadLibraries() {
                    if (app.libraries) {
                        return Promise.resolve(app.libraries);
                    }
                    return ApiClient.getJSON(ApiClient.getUrl('Library/MediaFolders')).then(function (result) {
                        app.libraries = ((result && result.Items) || []).filter(function (folder) {
                            return folder.CollectionType !== 'playlists';
                        });
                        return app.libraries;
                    }, function () {
                        app.libraries = [];
                        return app.libraries;
                    });
                }

                // One entry per score: the rating systems of every country share the scale (age).
                function loadRatings() {
                    if (app.ratings) {
                        return Promise.resolve(app.ratings);
                    }
                    return ApiClient.getJSON(ApiClient.getUrl('Localization/ParentalRatings')).then(function (ratings) {
                        var byScore = {};
                        (ratings || []).forEach(function (rating) {
                            if (typeof rating.Value !== 'number') {
                                return;
                            }
                            (byScore[rating.Value] = byScore[rating.Value] || []).push(rating.Name);
                        });
                        app.ratings = Object.keys(byScore).map(Number).sort(function (a, b) {
                            return a - b;
                        }).map(function (score) {
                            return { score: score, names: byScore[score] };
                        });
                        return app.ratings;
                    }, function () {
                        app.ratings = [];
                        return app.ratings;
                    });
                }

                function familyPanel() {
                    return page.querySelector('#pcaPanelFamily');

                function loadFamily() {
                    if (app.editor) {
