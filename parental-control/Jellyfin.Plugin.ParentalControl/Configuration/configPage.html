                    }
                    if (!app.family) {
                        familyPanel().innerHTML = '<p class="pca-card-desc">' + escapeHtml(t('loading')) + '</p>';
                    }
                    return Promise.all([getJson('Family'), loadLabels(), loadStatus()]).then(function (results) {
                        app.family = results[0] || [];
                        if (!app.editor && app.tab === 'family') {
                            renderFamily();
                        }
                    }, function () {
                        familyPanel().innerHTML = note(t('loadError'), true);
                    });
                }

                function usageMeter(today) {
                    if (!today || !today.Enabled || today.LimitMinutes < 0) {
                        return today && today.UsedSeconds ? '<span class="pca-member-meta">' + escapeHtml(t('todayUsageUnlimited', formatSeconds(today.UsedSeconds))) + '</span>' : '';
                    }
                    var total = (today.LimitMinutes + today.BonusMinutes) * 60;
                    var ratio = total > 0 ? Math.min(1, today.UsedSeconds / total) : 1;
                    var kind = ratio >= 1 ? ' pca-meter-over' : (ratio >= 0.8 ? ' pca-meter-warn' : '');
                    return '<span class="pca-member-meta">' + escapeHtml(t('todayUsage', formatSeconds(today.UsedSeconds), formatMinutes(today.LimitMinutes + today.BonusMinutes))) + '</span>' +
                        '<div class="pca-meter' + kind + '" role="presentation"><span style="width:' + Math.round(ratio * 100) + '%"></span></div>';
                }

                function memberStatus(member) {
                    if (member.IsAdministrator) {
                        return '<span class="pca-badge pca-badge-muted">' + escapeHtml(t('administrator')) + '</span>';
                    }
                    if (member.HasProfile && member.Enabled) {
                        return '<span class="pca-badge pca-badge-ok">' + escapeHtml(t('protected')) + '</span>';
                    }
                    if (member.HasProfile) {
                        return '<span class="pca-badge pca-badge-warn">' + escapeHtml(t('paused')) + '</span>';
                    }
                    return '<span class="pca-badge pca-badge-muted">' + escapeHtml(t('notProtected')) + '</span>';
                }

                function renderFamily() {
                    var family = app.family || [];
                    var anyProfile = family.some(function (member) {
                        return member.HasProfile;
                    });
                    var hero = anyProfile ? '' :
                        '<div class="pca-hero"><span class="pca-hero-icon">' + icon('shield') + '</span><div>' +
                        '<h2>' + escapeHtml(t('heroTitle')) + '</h2>' +
                        '<ol class="pca-steps"><li><b>1</b>' + escapeHtml(t('step1')) + '</li><li><b>2</b>' + escapeHtml(t('step2')) + '</li><li><b>3</b>' + escapeHtml(t('step3')) + '</li></ol>' +
                        '</div></div>';
                    var cards = family.map(function (member) {
                        var meta;
                        if (member.IsAdministrator) {
                            meta = t('adminNotControllable');
                        } else if (!member.HasProfile) {
                            meta = member.IsDisabled ? t('disabledAccount') : '';
                        } else if (member.Mode === 'AllowList') {
                            meta = t('modeAllowShort', member.RuleCount);
                        } else {
                            meta = member.RuleCount ? t('modeBlockShort', member.RuleCount) : t('noRestrictionYet');
                        }
                        var cta = member.IsAdministrator ? '' :
                            '<span class="pca-member-cta">' + icon(member.HasProfile ? 'tune' : 'add_moderator') + '<span>' + escapeHtml(member.HasProfile ? t('configure') : t('protect', member.Name)) + '</span></span>';
                        return '<button type="button" class="pca-member" data-action="open-member" data-user="' + escapeHtml(member.UserId) + '"' + (member.IsAdministrator ? ' disabled' : '') + '>' +
                            '<span class="pca-member-top">' + avatarHtml(member) + '<span style="min-width:0"><span class="pca-member-name" style="display:block">' + escapeHtml(member.Name) + '</span>' + memberStatus(member) + '</span></span>' +
                            (meta ? '<span class="pca-member-meta">' + escapeHtml(meta) + '</span>' : '') +
                            (member.HasProfile ? usageMeter(member.Today) : '') +
                            cta +
                            '</button>';
                    }).join('');
                    familyPanel().innerHTML = hero + '<div class="pca-family">' + cards + '</div>';
                }

                /* ---- profile editor ---- */

                var NEW_PROFILE_DEFAULTS = {
                    Enabled: true,
                    Mode: 'BlockList',
                    Hidden: [],
                    Allowed: [],
                    ScreenTime: { Enabled: false, DailyLimitMinutes: [90, 60, 60, 90, 60, 60, 90], WarningMinutes: 5, ShowRemaining: true },
                    HiddenElements: ['syncplay', 'cast'],
                    LockSession: false,
                    PinSignIn: false
                };

                function openEditor(userId) {
                    familyPanel().innerHTML = '<p class="pca-card-desc">' + escapeHtml(t('loading')) + '</p>';
                    Promise.all([getJson('Profiles/' + userId), loadLabels(), loadStatus()]).then(function (results) {
                        var view = results[0];
                        var isNew = !view.User.HasProfile;
                        var draft = { Profile: clone(view.Profile), Native: clone(view.Native) };
                        if (isNew) {
                            Object.keys(NEW_PROFILE_DEFAULTS).forEach(function (key) {
                                draft.Profile[key] = clone(NEW_PROFILE_DEFAULTS[key]);
                            });
                        }
                        app.editor = {
                            userId: userId,
                            view: view,
                            draft: draft,
                            baseline: JSON.stringify(draft),
                            isNew: isNew,
                            section: (app.editor && app.editor.userId === userId && app.editor.section) || 'content',
                            preview: null,
                            limitScope: 'all',
                            scheduleOn: draft.Native.AccessSchedules.length > 0,
                            saving: false
                        };
                        renderEditor();
                        loadPreview();
                        familyPanel().querySelector('.pca-editor-name').focus();
                    }, function () {
                        familyPanel().innerHTML = note(t('loadError'), true);
                    });
                }

                function isDirty() {
                    var editor = app.editor;
                    return !!editor && (editor.isNew || JSON.stringify(editor.draft) !== editor.baseline);
                }

                function changed(rerender) {
                    if (rerender) {
                        renderSection();
                    }
                    renderSaveBar();
                }

                function renderEditor() {
                    var editor = app.editor;
                    var view = editor.view;
                    var profile = editor.draft.Profile;
                    var nav = SECTIONS.map(function (section) {
                        return '<button type="button" class="pca-nav-item" role="tab" data-action="section" data-section="' + section.key + '" aria-selected="' + (section.key === editor.section ? 'true' : 'false') + '">' +
                            icon(section.icon) + '<span>' + escapeHtml(t(section.label)) + '</span></button>';
                    }).join('');
                    familyPanel().innerHTML =
                        '<div class="pca-editor-head">' +
                        '<button type="button" class="pca-btn pca-btn-ghost" data-action="back">' + icon('arrow_back') + '<span>' + escapeHtml(t('back')) + '</span></button>' +
                        avatarHtml(view.User, true) +
                        '<div style="flex:1;min-width:12em"><h2 class="pca-editor-name" tabindex="-1">' + escapeHtml(view.User.Name) + '</h2>' +
                        (editor.isNew ? '<span class="pca-member-meta">' + escapeHtml(t('newProfile')) + '</span>' : memberStatus(view.User)) + '</div>' +
                        '<label class="pca-option" style="border:0;padding:0;align-items:center" for="pcaEnabled"><span class="pca-option-text"><span class="pca-option-label">' + escapeHtml(t('protectionOn')) + '</span>' +
                        (profile.Enabled ? '' : '<span class="pca-option-help">' + escapeHtml(t('protectionHelp')) + '</span>') + '</span>' +
                        '<input type="checkbox" class="pca-switch" id="pcaEnabled" data-profile="Enabled"' + (profile.Enabled ? ' checked' : '') + ' /></label>' +
                        '</div>' +
                        '<div class="pca-editor-layout"><nav class="pca-nav" role="tablist" aria-label="' + escapeHtml(view.User.Name) + '">' + nav + '</nav>' +
                        '<div class="pca-editor-body" id="pcaSection"></div></div>';
                    renderSection();
                    renderSaveBar();
                }

                function renderSection() {
                    var editor = app.editor;
                    var host = familyPanel().querySelector('#pcaSection');
                    if (!editor || !host) {
                        return;
                    }
                    familyPanel().querySelectorAll('.pca-nav-item').forEach(function (item) {
                        item.setAttribute('aria-selected', item.getAttribute('data-section') === editor.section ? 'true' : 'false');
                    });
                    var scroll = window.scrollY;
                    switch (editor.section) {
                        case 'time':
                            host.innerHTML = timeSection();
                            break;
                        case 'interface':
                            host.innerHTML = interfaceSection();
                            break;
                        case 'signin':
                            host.innerHTML = signInSection();
                            break;
                        case 'activity':
                            host.innerHTML = activitySection();
                            break;
                        default:
                            host.innerHTML = contentSection();
                            Promise.all([loadRatings(), loadLibraries()]).then(function () {
                                var ratings = host.querySelector('#pcaRatingsCard');
                                if (ratings && app.editor === editor && editor.section === 'content') {
                                    ratings.outerHTML = ratingsCard();
                                }
                            });
                    }
                    if (editor.section === 'time') {
                        bindGrid(host.querySelector('.pca-grid'));
                    }
                    window.scrollTo(window.scrollX, scroll);
                }

                function contentSection() {
                    var editor = app.editor;
                    var profile = editor.draft.Profile;
                    var name = editor.view.User.Name;
                    var allowMode = profile.Mode === 'AllowList';
                    var modes = [
                        { mode: 'BlockList', icon: 'visibility', title: t('modeBlockTitle'), text: t('modeBlockText') },
                        { mode: 'AllowList', icon: 'verified_user', title: t('modeAllowTitle'), text: t('modeAllowText') }
                    ].map(function (mode) {
                        var selected = profile.Mode === mode.mode;
                        return '<label class="pca-mode' + (selected ? ' pca-selected' : '') + '">' +
                            '<input type="radio" name="pcaMode" value="' + mode.mode + '" data-action="mode"' + (selected ? ' checked' : '') + ' />' +
                            '<span class="pca-mode-icon">' + icon(mode.icon) + '</span>' +
                            '<span><span class="pca-mode-title">' + escapeHtml(mode.title) + '</span><span class="pca-mode-text">' + escapeHtml(mode.text) + '</span></span></label>';
                    }).join('');

                    var allowedCard = !allowMode ? '' :
                        '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('check_circle') + escapeHtml(t('allowedTitle')) + '</h3><span class="pca-spacer"></span>' +
                        '<button type="button" class="pca-btn pca-btn-primary" data-action="add-rule" data-list="Allowed">' + icon('add') + '<span>' + escapeHtml(t('add')) + '</span></button></div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('allowedHelp', name)) + '</p>' +
                        rulesHtml(profile.Allowed, 'Allowed', t('emptyAllowed', name)) + '</div>';

                    var hiddenCard = '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('visibility_off') + escapeHtml(t('hiddenTitle')) + '</h3><span class="pca-spacer"></span>' +
                        '<button type="button" class="pca-btn' + (allowMode ? '' : ' pca-btn-primary') + '" data-action="add-rule" data-list="Hidden">' + icon('add') + '<span>' + escapeHtml(t('add')) + '</span></button></div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('hiddenHelp')) + '</p>' +
                        rulesHtml(profile.Hidden, 'Hidden', t('emptyHidden')) + '</div>';

                    return '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('family_restroom') + escapeHtml(t('whatCanSee', name)) + '</h3></div>' +
                        '<div class="pca-modes" role="radiogroup" aria-label="' + escapeHtml(t('whatCanSee', name)) + '">' + modes + '</div></div>' +
                        allowedCard + hiddenCard + ratingsCard() + previewCard();
                }

                function ratingsCard() {
                    var native = app.editor.draft.Native;
                    var ratings = app.ratings;
                    var libraries = app.libraries;
                    if (!ratings || !libraries) {
                        return '<div class="pca-card" id="pcaRatingsCard"><p class="pca-card-desc">' + escapeHtml(t('loading')) + '</p></div>';
                    }
                    var options = '<option value="">' + escapeHtml(t('noLimit')) + '</option>' + ratings.map(function (rating) {
                        var others = rating.names.filter(function (name) {
                            return name !== rating.score + '+';
                        });
                        var names = others.slice(0, 4).join(', ') + (others.length > 4 ? '\u2026' : '');
                        return '<option value="' + rating.score + '"' + (native.MaxParentalRating === rating.score ? ' selected' : '') + '>' + escapeHtml(rating.score + '+' + (names ? ' \u00b7 ' + names : '')) + '</option>';
                    }).join('');
                    var unrated = UNRATED_KINDS.map(function (kind) {
                        var pressed = native.BlockUnratedItems.indexOf(kind) >= 0;
                        return '<button type="button" class="pca-chip-toggle" data-action="unrated" data-kind="' + kind + '" aria-pressed="' + pressed + '">' + (pressed ? icon('block') : '') + escapeHtml(t('unrated' + kind)) + '</button>';
                    }).join('');
                    var libraryChips = native.EnableAllFolders ? '' : '<div class="pca-chips" style="margin-top:0.6em">' + libraries.map(function (library) {
                        var pressed = native.EnabledFolders.indexOf(library.Id) >= 0;
                        return '<button type="button" class="pca-chip-toggle" data-action="library" data-id="' + escapeHtml(library.Id) + '" aria-pressed="' + pressed + '">' + icon(pressed ? 'check' : 'folder') + escapeHtml(library.Name) + '</button>';
                    }).join('') + '</div>';
                    return '<div class="pca-card" id="pcaRatingsCard"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('shield') + escapeHtml(t('ratingsTitle')) + '</h3></div>' +
                        '<div class="pca-field"><label class="pca-field-label" for="pcaRating">' + escapeHtml(t('maxRating')) + '</label>' +
                        '<select class="pca-select" id="pcaRating" data-action="rating" style="max-width:28em">' + options + '</select>' +
                        '<span class="pca-option-help">' + escapeHtml(t('ratingHelp')) + '</span></div>' +
                        '<div class="pca-field" style="margin-top:1.1em"><span class="pca-field-label">' + escapeHtml(t('blockUnrated')) + '</span><div class="pca-chips">' + unrated + '</div></div>' +
                        '<div class="pca-field" style="margin-top:1.1em"><span class="pca-field-label">' + escapeHtml(t('libraries')) + '</span>' +
                        '<div>' + switchRow('pcaAllFolders', native.EnableAllFolders, t('allLibraries'), '', null, 'data-native="EnableAllFolders"') + '</div>' + libraryChips + '</div>' +
                        '</div>';
                }

                function previewCard() {
                    var editor = app.editor;
                    var name = editor.view.User.Name;
                    var preview = editor.preview;
                    var body;
                    if (editor.isNew) {
                        body = note(t('previewUnsaved'));
                    } else if (!preview) {
                        body = '<p class="pca-card-desc">' + escapeHtml(t('loading')) + '</p>';
                    } else {
                        var stats = [['Movies', 'previewMovies'], ['Series', 'previewSeries'], ['Collections', 'previewCollections'], ['Albums', 'previewAlbums']].map(function (entry) {
                            return '<div class="pca-stat"><div class="pca-stat-value">' + escapeHtml(preview[entry[0]]) + '</div><div class="pca-stat-label">' + escapeHtml(t(entry[1])) + '</div></div>';
                        }).join('');
                        var posters = preview.Sample.length ? '<div class="pca-posters">' + preview.Sample.map(function (item) {
                            return '<div class="pca-poster"><div class="pca-poster-image"' + (item.HasImage ? ' style="background-image:url(\'' + escapeHtml(imageUrl(item.Id, 220)) + '\')"' : '') + '>' + (item.HasImage ? '' : icon(item.ItemType === 'Series' ? 'tv' : 'movie')) + '</div>' +
                                '<span class="pca-poster-name" title="' + escapeHtml(item.Name) + '">' + escapeHtml(item.Name) + '</span></div>';
                        }).join('') + '</div>' : '<div class="pca-empty">' + icon('visibility_off') + '<span>' + escapeHtml(t('previewEmpty')) + '</span></div>';
                        body = '<div class="pca-stats">' + stats + '</div>' + posters +
                            (preview.Syncing ? note(t('previewSyncing')) : '') +
                            (isDirty() ? note(t('previewUnsaved')) : '');
                    }
                    return '<div class="pca-card" id="pcaPreviewCard"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('preview') + escapeHtml(t('previewTitle', name)) + '</h3><span class="pca-spacer"></span>' +
                        (editor.isNew ? '' : '<button type="button" class="pca-btn pca-btn-small" data-action="preview-refresh">' + icon('refresh') + '<span>' + escapeHtml(t('refresh')) + '</span></button>') + '</div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('previewHelp', name)) + '</p>' + body + '</div>';
                }

                function loadPreview() {
                    var editor = app.editor;
                    if (!editor || editor.isNew) {
                        return;
                    }
                    getJson('Profiles/' + editor.userId + '/Preview').then(function (preview) {
                        if (app.editor !== editor) {
                            return;
                        }
                        editor.preview = preview;
                        var card = familyPanel().querySelector('#pcaPreviewCard');
                        if (card) {
                            card.outerHTML = previewCard();
                        }
                        if (preview.Syncing) {
                            setTimeout(function () {
                                if (app.editor === editor) {
                                    loadPreview();
                                }
                            }, 2500);
                        }
                    });
                }

                /* ---- screen time ---- */

                function timeSection() {
                    var editor = app.editor;
                    var screenTime = editor.draft.Profile.ScreenTime;
                    var name = editor.view.User.Name;
                    var limits = screenTime.DailyLimitMinutes;
                    var maxShown = Math.max.apply(null, limits.concat([60]));
                    var days = DAY_ORDER.map(function (day) {
                        var minutes = limits[day];
                        var unlimited = minutes < 0;
                        var label = dayName(day);
                        return '<div class="pca-day"><span class="pca-day-name">' + escapeHtml(label) + '</span>' +
                            '<span class="pca-stepper">' +
                            '<button type="button" class="pca-btn pca-btn-icon" data-action="day-step" data-day="' + day + '" data-delta="-1"' + (unlimited || minutes <= 0 || !screenTime.Enabled ? ' disabled' : '') + ' aria-label="' + escapeHtml(t('less', label)) + '">' + icon('remove') + '</button>' +
                            '<span class="pca-stepper-value">' + escapeHtml(unlimited ? t('unlimited') : (minutes === 0 ? t('noScreen') : formatMinutes(minutes))) + '</span>' +
                            '<button type="button" class="pca-btn pca-btn-icon" data-action="day-step" data-day="' + day + '" data-delta="1"' + (unlimited || minutes >= MAX_MINUTES || !screenTime.Enabled ? ' disabled' : '') + ' aria-label="' + escapeHtml(t('more', label)) + '">' + icon('add') + '</button>' +
                            '</span>' +
                            '<div class="pca-day-bar" aria-hidden="true"><span style="width:' + (unlimited ? 100 : Math.round(minutes / maxShown * 100)) + '%"></span></div>' +
                            '<button type="button" class="pca-chip-toggle" data-action="day-unlimited" data-day="' + day + '" aria-pressed="' + unlimited + '"' + (screenTime.Enabled ? '' : ' disabled') + ' aria-label="' + escapeHtml(t('toggleUnlimited', label)) + '">' + icon('all_inclusive') + '</button>' +
                            '</div>';
                    }).join('');
                    var scopes = [['all', 'everyDay'], ['weekdays', 'weekdays'], ['weekend', 'weekend']].map(function (scope) {
                        return '<button type="button" class="pca-seg" data-action="limit-scope" data-scope="' + scope[0] + '" aria-pressed="' + (editor.limitScope === scope[0]) + '">' + escapeHtml(t(scope[1])) + '</button>';
                    }).join('');
                    var presets = [30, 60, 90, 120, 180, -1].map(function (minutes) {
                        return '<button type="button" class="pca-chip-toggle" data-action="limit-preset" data-minutes="' + minutes + '"' + (screenTime.Enabled ? '' : ' disabled') + '>' + escapeHtml(minutes < 0 ? t('unlimited') : formatMinutes(minutes)) + '</button>';
                    }).join('');
                    var warningChoices = [0, 2, 5, 10, 15];
                    if (warningChoices.indexOf(screenTime.WarningMinutes) < 0) {
                        warningChoices.push(screenTime.WarningMinutes);
                        warningChoices.sort(function (x, y) {
                            return x - y;
                        });
                    }
                    var warnings = warningChoices.map(function (minutes) {
                        return '<option value="' + minutes + '"' + (screenTime.WarningMinutes === minutes ? ' selected' : '') + '>' + escapeHtml(minutes === 0 ? t('warningOff') : t('warningMinutes', minutes)) + '</option>';
                    }).join('');

                    var limitCard = '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('hourglass_bottom') + escapeHtml(t('dailyLimit')) + '</h3></div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('dailyLimitHelp')) + '</p>' +
                        '<div>' + switchRow('pcaLimitOn', screenTime.Enabled, t('enableLimit'), '', null, 'data-screen="Enabled"') + '</div>' +
                        '<div style="' + (screenTime.Enabled ? '' : 'opacity:0.55') + '">' +
                        '<div class="pca-row" style="margin:0.6em 0 0.9em"><span class="pca-field-label">' + escapeHtml(t('applyTo')) + '</span><span class="pca-segmented">' + scopes + '</span><span class="pca-chips">' + presets + '</span></div>' +
                        '<div class="pca-days">' + days + '</div>' +
                        '<div class="pca-row" style="margin-top:1em"><div class="pca-field"><label class="pca-field-label" for="pcaWarning">' + escapeHtml(t('warning')) + '</label>' +
                        '<select class="pca-select" id="pcaWarning" data-action="warning"' + (screenTime.Enabled ? '' : ' disabled') + '>' + warnings + '</select></div></div>' +
                        '<div style="margin-top:0.6em">' + switchRow('pcaShowRemaining', screenTime.ShowRemaining, t('showRemaining'), t('showRemainingHelp'), null, 'data-screen="ShowRemaining"' + (screenTime.Enabled ? '' : ' disabled')) + '</div>' +
                        '</div></div>';

                    return limitCard + todayCard() + scheduleCard(name);
                }

                function todayCard() {
                    var editor = app.editor;
                    if (editor.isNew) {
                        return '';
                    }
                    var today = editor.view.Usage.Today;
                    var limit = today.Enabled && today.LimitMinutes >= 0 ? today.LimitMinutes + today.BonusMinutes : -1;
                    var ratio = limit > 0 ? Math.min(100, Math.round(today.UsedSeconds / (limit * 60) * 100)) : (limit === 0 ? 100 : 0);
                    var color = ratio >= 100 ? 'var(--pca-error)' : (ratio >= 80 ? 'var(--pca-warn)' : 'var(--pca-ok)');
                    var bonusButtons = [15, 30, 60].map(function (minutes) {
                        return '<button type="button" class="pca-btn pca-btn-small" data-action="bonus" data-minutes="' + minutes + '">' + icon('more_time') + '<span>+' + escapeHtml(formatMinutes(minutes)) + '</span></button>';
                    }).join('') + (today.BonusMinutes > 0 ? '<button type="button" class="pca-btn pca-btn-small pca-btn-ghost" data-action="bonus" data-minutes="-' + today.BonusMinutes + '">' + icon('undo') + '<span>' + escapeHtml(t('takeBack')) + '</span></button>' : '');
                    return '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('today') + escapeHtml(t('todayTitle')) + '</h3></div>' +
                        '<div class="pca-today"><div class="pca-ring" style="--pca-ring:' + ratio + ';--pca-ring-color:' + color + '" role="img" aria-label="' + escapeHtml(limit >= 0 ? t('todayUsage', formatSeconds(today.UsedSeconds), formatMinutes(limit)) : t('todayUsageUnlimited', formatSeconds(today.UsedSeconds))) + '">' +
                        '<div class="pca-ring-inner"><span class="pca-ring-value">' + escapeHtml(formatSeconds(today.UsedSeconds)) + '</span><span class="pca-ring-label">' + escapeHtml(t('used')) + '</span>' +
                        (limit >= 0 ? '<span class="pca-ring-label">' + escapeHtml(formatSeconds(today.RemainingSeconds || 0) + ' ' + t('left')) + '</span>' : '') + '</div></div>' +
                        '<div><div class="pca-field-label">' + escapeHtml(t('bonus')) + '</div><p class="pca-option-help" style="margin:0.2em 0 0.7em">' + escapeHtml(t('bonusHelp')) + '</p>' +
                        (today.BonusMinutes > 0 ? '<p class="pca-member-meta" style="margin:0 0 0.6em">' + escapeHtml(t('bonusCurrent', formatMinutes(today.BonusMinutes))) + '</p>' : '') +
                        '<div class="pca-actions">' + bonusButtons + '</div></div></div></div>';
                }

                /* ---- access schedule (native) ---- */

                function scheduleToGrid(windows) {
                    var grid = DAY_KEYS.map(function () {
                        return new Array(SLOTS).fill(false);
                    });
                    (windows || []).forEach(function (window) {
                        DAY_KEYS.forEach(function (key, day) {
                            var weekend = day === 0 || day === 6;
                            var covers = window.DayOfWeek === 'Everyday' || window.DayOfWeek === key ||
                                (window.DayOfWeek === 'Weekday' && !weekend) || (window.DayOfWeek === 'Weekend' && weekend);
                            if (!covers) {
                                return;
                            }
                            for (var slot = Math.round(window.StartHour * 2); slot < Math.round(window.EndHour * 2) && slot < SLOTS; slot++) {
                                grid[day][slot] = true;
                            }
                        });
                    });
                    return grid;
                }

                function gridToSchedule(grid) {
                    var windows = [];
                    grid.forEach(function (slots, day) {
                        var start = -1;
                        for (var slot = 0; slot <= SLOTS; slot++) {
                            var on = slot < SLOTS && slots[slot];
                            if (on && start < 0) {
                                start = slot;
                            } else if (!on && start >= 0) {
                                windows.push({ DayOfWeek: DAY_KEYS[day], StartHour: start / 2, EndHour: slot / 2 });
                                start = -1;
                            }
                        }
                    });
                    return windows;
                }

                function scheduleSummary(grid) {
                    return DAY_ORDER.map(function (day) {
                        var ranges = gridToSchedule(grid.map(function (slots, index) {
                            return index === day ? slots : new Array(SLOTS).fill(false);
                        })).map(function (window) {
                            return formatHour(window.StartHour) + '\u2013' + formatHour(window.EndHour);
                        });
                        return dayName(day, 'short') + ' ' + (ranges.length ? ranges.join(', ') : t('scheduleNone'));
                    }).join(' \u00b7 ');
                }

                function scheduleCard(name) {
                    var native = app.editor.draft.Native;
                    var enabled = app.editor.scheduleOn;
                    var grid = scheduleToGrid(native.AccessSchedules);
                    var now = new Date();
                    var nowSlot = now.getHours() * 2 + (now.getMinutes() >= 30 ? 1 : 0);
                    var hours = '<span class="pca-grid-corner"></span>';
                    for (var h = 0; h < 24; h += 2) {
                        hours += '<span class="pca-grid-hour">' + (h < 10 ? '0' : '') + h + 'h</span>';
                    }
                    var rows = DAY_ORDER.map(function (day) {
                        var cells = '';
                        for (var slot = 0; slot < SLOTS; slot++) {
                            var classes = 'pca-slot' + (grid[day][slot] ? ' pca-on' : '') + (day === now.getDay() && slot === nowSlot ? ' pca-now' : '');
                            cells += '<span class="' + classes + '" data-day="' + day + '" data-slot="' + slot + '" title="' + escapeHtml(dayName(day, 'short') + ' ' + formatHour(slot / 2) + '\u2013' + formatHour((slot + 1) / 2)) + '"></span>';
                        }
                        return '<span class="pca-grid-day">' + escapeHtml(dayName(day, 'short')) + '</span>' + cells;
                    }).join('');
                    return '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('schedule') + escapeHtml(t('scheduleTitle')) + '</h3></div>' +
                        '<p class="pca-card-desc">' + escapeHtml(t('scheduleHelp', name)) + '</p>' +
                        '<div>' + switchRow('pcaScheduleOn', enabled, t('scheduleEnable'), '', null, 'data-action="schedule-toggle"') + '</div>' +
                        (enabled ?
                            '<div class="pca-row" style="margin:0.4em 0 0.9em">' +
                            '<button type="button" class="pca-btn pca-btn-small" data-action="schedule-preset" data-preset="school">' + icon('school') + '<span>' + escapeHtml(t('presetSchool')) + '</span></button>' +
                            '<button type="button" class="pca-btn pca-btn-small" data-action="schedule-preset" data-preset="daytime">' + icon('wb_sunny') + '<span>' + escapeHtml(t('presetDaytime')) + '</span></button>' +
                            '<button type="button" class="pca-btn pca-btn-small pca-btn-ghost" data-action="schedule-preset" data-preset="clear">' + icon('layers_clear') + '<span>' + escapeHtml(t('clearAll')) + '</span></button>' +
                            '</div>' +
                            '<p class="pca-option-help" style="margin:0 0 0.6em">' + escapeHtml(t('schedulePaintHelp')) + '</p>' +
                            '<div class="pca-grid" tabindex="0" role="application" aria-label="' + escapeHtml(t('gridLabel')) + '" aria-describedby="pcaScheduleSummary">' + hours + rows + '</div>' +
                            '<div class="pca-legend"><span><i class="pca-on"></i>' + escapeHtml(t('allowed')) + '</span><span><i></i>' + escapeHtml(t('forbidden')) + '</span></div>' +
                            (native.AccessSchedules.length ? '' : note(t('scheduleEmpty'), true)) +
                            '<p class="pca-option-help" id="pcaScheduleSummary" aria-live="polite" style="margin-top:0.6em">' + escapeHtml(scheduleSummary(grid)) + '</p>'
                            : '') +
                        '</div>';
                }

                function presetGrid(preset) {
                    var grid = DAY_KEYS.map(function () {
                        return new Array(SLOTS).fill(false);
                    });
                    function allow(day, from, to) {
                        for (var slot = from * 2; slot < to * 2; slot++) {
                            grid[day][slot] = true;
                        }
                    }
                    if (preset === 'school') {
                        [1, 2, 3, 4, 5].forEach(function (day) {
                            allow(day, 7, 8.5);
                            allow(day, 16.5, 20);
                        });
                        allow(3, 8.5, 16.5);
                        allow(0, 8, 20.5);
                        allow(6, 8, 20.5);
                    } else if (preset === 'daytime') {
                        DAY_KEYS.forEach(function (key, day) {
                            allow(day, 8, 20);
                        });
                    }
                    return grid;
                }

                // Painting: the first cell decides whether the drag allows or forbids, like a brush.
                function bindGrid(gridNode) {
                    if (!gridNode) {
                        return;
                    }
                    var native = app.editor.draft.Native;
                    var grid = scheduleToGrid(native.AccessSchedules);
                    var painting = null;
                    var cursor = { day: DAY_ORDER[0], slot: 16 };

                    function cell(day, slot) {
                        return gridNode.querySelector('.pca-slot[data-day="' + day + '"][data-slot="' + slot + '"]');
                    }

                    function set(day, slot, value) {
                        grid[day][slot] = value;
                        var node = cell(day, slot);
                        if (node) {
                            node.classList.toggle('pca-on', value);
                        }
                    }

                    function commit() {
                        native.AccessSchedules = gridToSchedule(grid);
                        var summary = familyPanel().querySelector('#pcaScheduleSummary');
                        if (summary) {
                            summary.textContent = scheduleSummary(grid);
                        }
                        changed(false);
                    }

                    function fromEvent(e) {
                        var target = document.elementFromPoint(e.clientX, e.clientY);
                        return target && target.classList.contains('pca-slot') && gridNode.contains(target) ? target : null;
                    }

                    gridNode.addEventListener('pointerdown', function (e) {
                        var node = e.target.closest('.pca-slot');
                        if (!node) {
                            return;
                        }
                        e.preventDefault();
                        var day = Number(node.getAttribute('data-day'));
                        var slot = Number(node.getAttribute('data-slot'));
                        painting = !grid[day][slot];
                        set(day, slot, painting);
                        cursor = { day: day, slot: slot };
                    });
                    gridNode.addEventListener('pointermove', function (e) {
                        if (painting === null) {
                            return;
                        }
                        var node = fromEvent(e);
                        if (node) {
                            set(Number(node.getAttribute('data-day')), Number(node.getAttribute('data-slot')), painting);
                        }
                    });
                    function stop() {
                        if (painting !== null) {
                            painting = null;
                            commit();
                        }
                    }
                    gridNode.addEventListener('pointerup', stop);
                    gridNode.addEventListener('pointerleave', stop);
                    gridNode.addEventListener('keydown', function (e) {
                        var row = DAY_ORDER.indexOf(cursor.day);
                        if (e.key === 'ArrowRight') {
                            cursor.slot = Math.min(SLOTS - 1, cursor.slot + 1);
                        } else if (e.key === 'ArrowLeft') {
                            cursor.slot = Math.max(0, cursor.slot - 1);
                        } else if (e.key === 'ArrowDown') {
                            cursor.day = DAY_ORDER[Math.min(6, row + 1)];
                        } else if (e.key === 'ArrowUp') {
                            cursor.day = DAY_ORDER[Math.max(0, row - 1)];
                        } else if (e.key === ' ' || e.key === 'Enter') {
                            set(cursor.day, cursor.slot, !grid[cursor.day][cursor.slot]);
                            commit();
                        } else {
                            return;
                        }
                        e.preventDefault();
                        gridNode.querySelectorAll('.pca-slot.pca-now').forEach(function (node) {
                            node.classList.remove('pca-now');
                        });
                        var node = cell(cursor.day, cursor.slot);
                        if (node) {
                            node.classList.add('pca-now');
                            gridNode.setAttribute('aria-label', t('gridLabel') + ' \u2013 ' + node.title + ' \u2013 ' + (grid[cursor.day][cursor.slot] ? t('allowed') : t('forbidden')));
                        }
                    });
                }

                    return '<div class="pca-card"><div class="pca-card-head"><h3 class="pca-card-title">' + icon('login') + escapeHtml(t('signInTitle')) + '</h3></div>' +
