name: Build plugins

on:
  push:
    branches: [main]
    paths-ignore: ["manifest.json", "**/*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [customized-home]
        jellyfin: ["12.1.0", "10.11.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and package
        run: python3 scripts/package.py ${{ matrix.plugin }} --jellyfin ${{ matrix.jellyfin }} --output artifacts > summary.json
      - name: Check client script syntax
        run: node --check ${{ matrix.plugin }}/*/Web/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.jellyfin }}
          path: |
            artifacts/*.zip
            summary.json

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test customized-home/Jellyfin.Plugin.CustomizedHome.Tests/Jellyfin.Plugin.CustomizedHome.Tests.csproj --nologo

  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customized-home/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
