targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Easily edit and organize the sections on your homepage"
description: >
  Customized Home lets every user reorganize the Jellyfin home screen: reorder sections by
  drag and drop, show or hide them, choose a display format per section (poster, landscape,
  square, size, titles) and search among all known sections. Optional hero banner at the top:
  a carousel of featured media (random, recently added, latest releases) with backdrop, logo,
  synopsis, ratings and play / resume / trailer / favorite actions. Adds its own sections without
  any other plugin: Continue Watching / Next Up combined, latest movies and shows by release
  date, collections, watch again, because you watched, genre. Works with the built-in
  sections and with sections added by other plugins (Home Screen Sections, ...).
  Administrators define a default layout. Web client only (browser, Jellyfin Desktop, the
  Android and iOS apps): native clients such as Android TV, Swiftfin or Kodi are not affected.
  Requires the File Transformation plugin.
category: "General"
owner: "leguian"
artifacts:
- "Jellyfin.Plugin.CustomizedHome.dll"
changelog: >
  Housekeeping. The administration page asks its questions in the page instead of a browser prompt, like the
  editor does. The dots of the hero are easier to hit on a touch screen. At server start the layouts left behind
  by users deleted while the plugin was not running are removed. Saving the default layout or reading a genre
  thumbnail answers a readable error instead of a generic failure when the disk refuses, and a default layout
  that could not be written is no longer applied until the next restart.
