overview: "Reorder, hide and group the home screen sections into folders."
description: >
  Customized Home lets every user reorganize the Jellyfin home screen: reorder sections by
  drag and drop, hide or show them, and group them into collapsible folders (for example a
  "Series" folder holding every series related section). Works with the built-in sections and
  with sections added by other plugins (Home Screen Sections, Jellyfin Enhanced, ...).
  Requires the File Transformation plugin to inject the client script.
