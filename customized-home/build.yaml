targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Easily edit and organize the sections on your homepage"
description: >
  Customized Home lets every user reorganize the Jellyfin home screen: reorder sections by
  drag and drop, show or hide them, choose a display format per section (poster, landscape,
  square, size, titles) and search among all known sections. Optional hero banner at the top:
  a carousel of featured media (random, recently added, latest releases) with backdrop, logo,
  synopsis, ratings and play / resume / trailer / favorite actions. Adds its own sections without
  any other plugin: Continue Watching / Next Up combined, latest movies and shows by release
  date, collections, watch again, because you watched, genre. Works with the built-in
  sections and with sections added by other plugins (Home Screen Sections, ...).
  Administrators define a default layout. Requires the File Transformation plugin.
category: "General"
owner: "leguian"
artifacts:
- "Jellyfin.Plugin.CustomizedHome.dll"
changelog: >
  Reliability and privacy. Logging out or switching user in the same tab no longer keeps the previous
  user's layout and cached rows. Continue Watching / Next Up, Watch Again, Because You Watched and the hero
  are reloaded when the home page is shown again, without flicker. A failing server is retried with
  growing delays. A message explains why a layout is not applied or why the home page is empty, and how to
  fix it. Hero: favorite and watched now work on mobile and TV, "From the beginning" really restarts. The
  default layout no longer reveals libraries a user cannot access. "All genres" is displayed at once and
  loads its poster collages as the cards come into view. Layout uploads are size limited.
